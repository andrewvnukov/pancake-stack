<style>
  :root{
    /* ── Токены под тему «воскресное утро на кухне, блинная горка» ── */
    --ink:#5C3B23; --ink-soft:#A0806A; --line:#6B4426;
    --paper:#FFF7E8;
    --accent:#E8A33D; --accent-deep:#C97F22;
    --gold:#F2C14E; --mint:#8FBF7A; --lav:#B497D6; --dusk:#7BA6C9;
    --bg:#F6D9A0;
    --ok:#8FBF7A; --ok-deep:#548C3E; --rowbg:#FFF3DC;
  }
  [hidden]{display:none!important}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:560px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;
        display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(92,59,35,.28)}
  .chip .ic{width:26px;height:26px;flex:none}
  .chip .tx{display:flex;flex-direction:column;gap:1px}
  .chip .v{font-weight:900;font-size:17px;line-height:1}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  #side{position:absolute;right:max(12px,calc(50% - 268px));top:118px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .rbtn{width:52px;height:52px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        box-shadow:0 3px 0 rgba(92,59,35,.28);display:flex;align-items:center;justify-content:center;
        cursor:pointer;transition:transform .08s,box-shadow .08s;padding:0}
  .rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(92,59,35,.28)}
  .rbtn svg{width:27px;height:27px;display:block}
  .rbtn .langTxt{font-weight:900;font-size:13px;color:var(--ink);letter-spacing:.2px}
  .bottom{display:flex;gap:10px;pointer-events:auto}
  .abtn{flex:1;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;
        font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(92,59,35,.28);
        transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(92,59,35,.28)}
  .abtn .bt{font-size:15px;line-height:1.05}
  .abtn .bs{font-size:11px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:3px}
  .abtn .bs svg{width:12px;height:12px}
  .abtn.blue{background:var(--dusk);border-color:#4C7089}
  .abtn.lav{background:var(--lav);border-color:#8767AD}
  .abtn.off{filter:grayscale(.55) brightness(.92)}
  /* ── модалка (начинки/апгрейды/полка) ── */
  #modal{position:absolute;inset:0;background:rgba(40,24,10,.55);display:flex;align-items:flex-end;
         justify-content:center;pointer-events:auto;z-index:9;transition:opacity .2s}
  #modal.hidden{opacity:0;pointer-events:none}
  .sheet{position:relative;background:linear-gradient(180deg,#FFFDF5,#FBEED2);width:100%;max-width:560px;
         border:3px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
         padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:85%;
         display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(40,24,10,.3)}
  #mScroll{overflow-y:auto;overflow-x:hidden}
  #mTitle{font-weight:900;font-size:20px;text-align:center;margin:2px 44px 12px;color:var(--ink)}
  #mClose{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;z-index:2;
          background:var(--paper);border:2.5px solid var(--line);font-size:21px;font-weight:900;
          color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(92,59,35,.28)}
  #mClose:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(92,59,35,.28)}
  .row{display:flex;align-items:center;gap:10px;background:#FFF8E6;border:2.5px solid var(--line);
       border-radius:16px;padding:9px 10px;margin-bottom:9px;box-shadow:0 2px 0 rgba(92,59,35,.18)}
  .row .thumb{width:52px;height:44px;flex:none;background:#F1E3C6;border:2px solid var(--line);border-radius:11px}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px;line-height:1.1}
  .row .ds{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:1px}
  .buy{border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
       font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;
       box-shadow:0 2px 0 rgba(92,59,35,.25);flex:none}
  .buy:active{transform:translateY(1px)}
  .buy.can-not{background:#CFC7B4;border-color:#B3AB98;color:#7C7462}
  .buy.owned{background:var(--mint);border-color:#5FA045}
  .buy.maxed{background:var(--lav);border-color:#8767AD}
  .coll{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .card{background:#FFF8E6;border:2.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;
        text-align:center;box-shadow:0 2px 0 rgba(92,59,35,.18)}
  .card canvas{width:78px;height:56px;display:block;margin:0 auto}
  .card .cn{font-weight:900;font-size:12px;margin-top:3px}
  .card.locked{opacity:.72}
  .card .qm{font-weight:900;font-size:30px;color:var(--ink-soft);height:56px;line-height:56px}
  /* ── средний горизонт: полоска остановки под шапкой ── */
  .routebar{width:100%;max-width:340px;margin-top:8px;background:var(--paper);border:2.5px solid var(--line);
        border-radius:16px;padding:7px 10px;box-shadow:0 3px 0 rgba(0,0,0,.22);pointer-events:auto;
        cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;font-family:inherit;color:var(--ink)}
  .routebar:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
  .rb-head{display:flex;align-items:center;gap:7px;font-weight:900;font-size:12.5px;line-height:1.1}
  .rb-head .dots{display:flex;gap:3px;flex:none}
  .rb-head .dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.18);border:1.5px solid var(--line);display:block}
  .rb-head .dots i.on{background:var(--ok)}
  .rb-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rb-goal{display:flex;gap:6px;align-items:baseline;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
  .rb-goal .gp{margin-left:auto;font-weight:900;color:var(--ink);flex:none}
  .rb-goal.ready{color:var(--ok-deep)}
  .top{flex-wrap:wrap}
  .chip{min-width:0}
  @media (max-width:370px){
    .chip{padding:5px 8px 5px 6px;gap:5px}
    .chip .ic{width:20px;height:20px}
    .chip .v{font-size:14px}
    .chip .l{font-size:8.5px;letter-spacing:0}
  }
  /* ── карта маршрута ── */
  .stop{display:flex;gap:10px;align-items:flex-start;background:var(--rowbg);border:2.5px solid var(--line);
        border-radius:16px;padding:9px 10px;margin-bottom:8px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .stop.cur{border-color:var(--accent-deep)}
  .stop.done{opacity:.86}
  .stop.fog{opacity:.6}
  .stop .num{width:30px;height:30px;flex:none;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
  .stop.done .num{background:var(--ok);color:#fff}
  .stop.cur .num{background:var(--accent);color:#fff}
  .stop .sb{flex:1;min-width:0}
  .stop .sn{font-weight:900;font-size:15px}
  .stop .sw{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:2px}
  .glist{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .gitem{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:800;background:var(--paper);
        border:2px solid var(--line);border-radius:11px;padding:5px 8px}
  .gitem .gm{width:15px;height:15px;flex:none;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.14)}
  .gitem.ok .gm{background:var(--ok)}
  .gitem .gt{flex:1;min-width:0}
  .gitem .gv{font-weight:900;flex:none}
  .wide{width:100%;border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
        font-size:15px;padding:11px;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);
        margin-top:4px;font-family:inherit}
  .wide:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .wide.okb{background:var(--ok);border-color:var(--ok-deep)}
  .wide.ghost{background:rgba(0,0,0,.07);border-color:var(--ink-soft);color:var(--ink-soft)}
  .note{font-size:12px;font-weight:800;color:var(--ink-soft);text-align:center;margin:8px 2px 2px;line-height:1.35}
  .offline{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;background:var(--rowbg);
        border:2.5px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:7px}
  .offline .ov{margin-left:auto;font-weight:900}
  .dayrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
  .dayc{border:2.5px solid var(--line);border-radius:11px;background:var(--rowbg);padding:6px 2px;text-align:center;
        font-weight:900;font-size:10.5px;box-shadow:0 2px 0 rgba(0,0,0,.13)}
  .dayc.past{background:var(--ok);color:#fff}
  .dayc.cur{background:var(--gold);border-color:var(--accent-deep)}
  .dayc .dv{display:block;font-size:9px;font-weight:800;opacity:.9;margin-top:2px}
  /* ── контекстная подсказка ── */
  .bubble{position:fixed;width:230px;z-index:20;background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;
        line-height:1.3;padding:9px 11px;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);
        transform:translate(-50%,-100%);pointer-events:none}
  .bubble.side{transform:translate(-100%,-50%)}
  .tipTarget{position:relative;z-index:16;outline:3px solid var(--gold);outline-offset:2px;border-radius:14px;
        animation:tipPulse 1.2s ease-in-out infinite}
  @keyframes tipPulse{0%,100%{outline-color:var(--gold)}50%{outline-color:rgba(240,193,78,.35)}}
  #toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;z-index:8;text-align:center;max-width:82%}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
'use strict';
// ============================================================
//  Блинная Горка / Pancake Stack — точная механика стекинга (в духе
//  классической игры Stack), впервые в конвейере: тап роняет блин на
//  вершину стопки, выступающий край срезается, идеальная укладка даёт
//  комбо и полную ширину; промах без страховки — стопка падает, высота
//  раунда идёт в награду и рекорд, начинается новый заход без штрафа.
// ============================================================
const SAVE_KEY = "pancake_stack_v1";
const LB_NAME  = "height";
let ysdk=null, player=null, lb=null, saveT=0, booted=false;

// ---------- i18n ----------
// Язык платформы читаем ПЕРВЫМ ДЕЛОМ на каждом запуске, до применения
// сохранённого выбора игрока: если код выходит раньше, чем дойдёт до
// ysdk.environment.i18n.lang, дебаг-панель площадки покажет «I18N is not used».
// Автоопределённый язык НЕ сохраняем — сохраняется только явный выбор игрока.
let platformLang=null;
function readPlatformLang(){
  try{ if(ysdk&&ysdk.environment&&ysdk.environment.i18n&&ysdk.environment.i18n.lang){
    platformLang = ysdk.environment.i18n.lang==="ru"?"ru":"en"; return platformLang; } }catch(e){}
  platformLang = (navigator.language||"ru").slice(0,2)==="ru"?"ru":"en";
  return platformLang;
}
function lang(){
  if(platformLang===null) readPlatformLang();
  try{ if(S && (S.lang==="ru"||S.lang==="en")) return S.lang; }catch(e){}
  return platformLang;
}
function toggleLang(){
  S.lang = lang()==="ru" ? "en" : "ru";
  document.documentElement.setAttribute("lang", S.lang);
  refreshHud(); persist(true); sfx("tap");
}

               en:"The shelf, upgrades and honey come with you. Past places keep earning."},

const ROUTE = [

  { id:'s5', twist:'w5', maxItems:9, pal:{sky1:'#FFF3D0', sky2:'#DCE9F7', warm:'#F2E06A'} },
];
const ROUTE_N = ROUTE.length;
// Во столько примерно вырастает доход за круг: всё, что измеряется в мёде,
// на следующем круге считается от темпа игрока, а не абсолютными числами.
const LOOP_SCALE = 550;
const MAX_LOOP = 20;              // за этим пределом Math.pow уходит в Infinity
const loopScale = () => Math.pow(LOOP_SCALE, Math.min(MAX_LOOP, S.loop||0));

// Чек-лист места — ровно три пункта РАЗНОГО типа (собрать / достичь / сделать).
const GOALS = [
  [ {t:'collect',n:3}, {t:'income',n:5.5e2}, {t:'height',n:12} ],
  [ {t:'collect',n:4}, {t:'income',n:1.8e3}, {t:'drops',n:150} ],

  [ {t:'collect',n:9}, {t:'income',n:3.0e5}, {t:'seeds',n:6} ],
];
const stop      = () => ROUTE[Math.min(ROUTE_N-1, Math.max(0, S.route|0))];
const stopIdx   = () => Math.min(ROUTE_N-1, Math.max(0, S.route|0));
// Твист включён навсегда, как только игрок до него доехал, и второй круг
// НИЧЕГО не отнимает: пройденный маршрут оставляет все правила открытыми.
const hasTwist  = w => (S.loop||0)>0 || ROUTE.some((r,i)=> r.twist===w && stopIdx()>=i);
const itemsUnlocked = () => (S.loop||0)>0 ? TOPPINGS.length : Math.max(3, stop().maxItems);

  seeds:0, seedsUsed:0,                         // премиальная валюта и растопленные соты
  route:0, routeDone:[], routeSeen:0, loop:0, finaleSeen:0,
  stack:null, combo:0, roundSaves:0, speedLvl:0,

  shortcutAsked:false, reviewAsked:false,

let S = fresh();

// ============================================================
//  ЭКОНОМИКА
//  Одно место, где собраны ВСЕ множители (idle-economy-balance.md §6).
//  Внутри источника — сложение, между источниками — умножение.
//  Единственный временный множитель — ×2 за ролик: худший случай ×2, не ×8.
// ============================================================
const MAX_TRAY=12, MAX_EYE=12, MAX_STEADY=5;
const x2On        = () => Date.now() < S.x2Until;

// ── постоянные источники ──
const seedMult    = () => Math.pow(1.10, S.seedsUsed||0);      // соты: умножение (§4.2)
const loopMult    = () => 1 + 0.25*(S.loop||0);                // пройденные круги: сложение
const toppingMult = () => 1 + S.toppings.reduce((a,id)=>{ const t=TI(id); return a+(t?t.mult:0); },0);
const permMult    = () => toppingMult()*seedMult()*loopMult();

// ── полка как источник пассивного дохода ──
const jarCount   = id => (S.jars && S.jars[id]) ? S.jars[id] : 0;
const farmCount  = jarCount;
const farmTotal  = () => TOPPINGS.reduce((a,t)=>a+jarCount(t.id),0);
const collectionCount = () => S.toppings.length;
const ITEMS = TOPPINGS, ITEM_ICON = "🍯", ITEM_ICON2 = "🫙";
const baseIps = () => TOPPINGS.reduce((a,t)=> a + jarCount(t.id)*t.ips, 0) * permMult();
const ips     = () => baseIps() * (x2On()?2:1);

// ── укладка блина ──
const comboMult    = () => Math.min(4, 1+S.combo*0.25);
// «золотой блин» (твист) — каждый седьмой впятеро дороже
const goldenDrop   = () => hasTwist('w2') && ((S.drops+1)%7===0);
const dropBase     = () => (3+Math.floor(S.stack.length*0.5)) * permMult() * loopScale();
const dropGain     = () => dropBase() * comboMult() * (goldenDrop()?5:1) * (x2On()?2:1);
const perfectRatio = () => Math.max(0.6, 0.92 - 0.025*S.upEye);
const missRatio     = 0.14;
const panWide       = () => hasTwist('w4') ? 1.25 : 1;    // «широкая сковорода»
const dropsPerTap   = () => hasTwist('w5') ? 2 : 1;       // «двойная порция»
const freeSaves     = () => S.upSteady + (hasTwist('w3')?1:0);

// ── цены ──
const trayCost   = () => S.upTray  >=MAX_TRAY  ?0:Math.round(50*Math.pow(1.6,S.upTray)*loopScale());
const eyeCost    = () => S.upEye   >=MAX_EYE   ?0:Math.round(70*Math.pow(1.55,S.upEye)*loopScale());
const steadyCost = () => S.upSteady>=MAX_STEADY?0:Math.round(60*Math.pow(2.0,S.upSteady)*loopScale());
const nextTopping= () => TOPPINGS.find((t,i)=> !S.toppings.includes(t.id) && i<itemsUnlocked());
const toppingCost= t => Math.max(1, Math.round(t.cost * Math.pow(COPY_MUL, jarCount(t.id)) * loopScale()));
const upCost = () => { const n=nextTopping(); return n? toppingCost(n) : 0; };

// ============================================================
//  earn / grant — подарки НЕ идут в метрики прогресса
//  (idle-monetization.md §9, idle-economy-balance.md §7)

function earn(a){ if(!(a>0)) return; S.coins+=a; S.lifetime=(S.lifetime||0)+a; }
function grant(a){ if(!(a>0)) return; S.coins+=a; }
function spend(a){ S.coins=Math.max(0, S.coins-a); }

// ── источники для целей чек-листа, специфичные для этой игры ──
const GOAL_SRC = {

  combo:  () => S.maxCombo,

// ---------- Сейвы ----------
function persist(force, flush){
  if(catchUp || testNoSave) return;   // во время досчёта офлайна не сохраняем на каждом шаге
  const now=Date.now();
  if(!force && now-saveT<10000) return;
  saveT=now;
  S.lastSeen=now;
  const raw=JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}, !!flush); }catch(e){} }
}
let lastFlushAt=0;
function flushSave(){
  // дожим накопленной облачной записи при уходе со страницы; сам дожим тоже
  // троттлим, иначе дёрганое переключение вкладок сожжёт лимит (100 запросов/5 мин)
  const now=Date.now();
  if(now-lastFlushAt<3000) return;
  lastFlushAt=now; persist(true, true);
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ audioSuspend(); flushSave(); } else audioResume(); });
addEventListener("pagehide", flushSave);
function restore(raw){
  if(!raw) return;
  // битый/чужой сейв не должен заклинивать запуск: при ошибке разбора остаётся
  // ЧИСТЫЙ fresh(), а не наполовину слитый объект
  let hadRoute=true;
  try{
    const d=(typeof raw==="string")?JSON.parse(raw):(raw.save?JSON.parse(raw.save):raw);
    if(d&&typeof d==="object"){ hadRoute=(typeof d.route==="number"); S=Object.assign(fresh(),d); }
  }catch(e){ S=fresh(); return; }

  // неизвестный id начинки (сейв из будущей версии) резолвится в «ничего»,
  // а не в самую дорогую начинку игры
  if(!Array.isArray(S.toppings)) S.toppings=[];
  S.toppings = S.toppings.filter(id => !!TI(id));
  // полка: в старых сейвах её нет — каждый открытый вид считаем за одну банку,
  // чтобы действующий игрок не потерял свой доход
  if(!S.jars || typeof S.jars!=="object" || Array.isArray(S.jars)) S.jars={};
  const jars={};
  TOPPINGS.forEach(t=>{ const n=Math.max(0, Math.round(Number(S.jars[t.id])||0));
    if(n>0) jars[t.id]=Math.min(n, 1e6); });
  S.toppings.forEach(id=>{ if(!jars[id]) jars[id]=1; });
  S.jars=jars;

  const num=(v,d)=>(typeof v==="number" && isFinite(v) && v>=0)?v:d;
  S.coins=num(S.coins,0); S.lifetime=num(S.lifetime,S.coins);
  S.upTray  =Math.min(MAX_TRAY,  num(S.upTray,0)|0);
  S.upEye   =Math.min(MAX_EYE,   num(S.upEye,0)|0);
  S.upSteady=Math.min(MAX_STEADY,num(S.upSteady,0)|0);
  S.bestHeight=num(S.bestHeight,0)|0; S.drops=num(S.drops,0)|0; S.maxCombo=num(S.maxCombo,0)|0;
  S.seeds=num(S.seeds,0)|0; S.seedsUsed=num(S.seedsUsed,0)|0;
  S.loop=Math.min(MAX_LOOP,num(S.loop,0)|0);
  if(!S.daily || typeof S.daily!=="object") S.daily={day:"",streak:0};
  S.daily.streak=Math.min(7,Math.max(0,num(S.daily.streak,0)|0));
  if(typeof S.daily.day!=="string") S.daily.day="";
  if(!S.tips || typeof S.tips!=="object") S.tips={};   // поле появилось позже самой игры

  // ── миграция маршрута: у старого сейва полей маршрута нет ──
  // место вычисляем из уже достигнутого и ПРОМАТЫВАЕМ выполненное БЕЗ ВЫПЛАТ
  S.route=Math.min(ROUTE_N-1, Math.max(0, num(S.route,0)|0));
  if(!Array.isArray(S.routeDone)) S.routeDone=[];
  if(!hadRoute){
    let r=0;
    for(let i=0;i<ROUTE_N;i++){ if(goalsMetAt(i)) r=Math.min(ROUTE_N-1,i+1); else break; }
    S.route=r; S.routeDone=[]; S.routeSeen=Math.min(ROUTE_N-1,r+1);
    S.seedsUsed=0;                                    // соты за прошлое не выдаём
  }
  S.routeSeen=Math.min(ROUTE_N-1, Math.max(S.route, num(S.routeSeen,0)|0));
  S.finaleSeen=num(S.finaleSeen,0)|0;
  S.lastSeen=num(S.lastSeen,0);
}

//  Ролик стартует ТОЛЬКО по явному нажатию игрока. Звук глушим вручную
//  в onOpen и возвращаем в onClose: страница при показе рекламы фокус
//  НЕ теряет, поэтому visibilitychange здесь не сработает.
// ============================================================
const AD_IDLE_S=30, AD_GAP_S=210, AD_WARMUP_S=90, AD_RETRY_S=45;
let nextAdAt=0, lastInputAt=Date.now(), adBusy=false, bootAt=Date.now();
addEventListener('pointerdown', ()=>{ lastInputAt=Date.now(); }, true);

function adAllowed(){
  if(!booted || adBusy || !ysdk) return false;
  if(document.hidden) return false;                       // показ в фон — мимо
  if(Date.now()-bootAt < AD_WARMUP_S*1000) return false;  // не встречаем игрока рекламой
  if(Date.now() < nextAdAt) return false;
  if(Date.now()-lastInputAt < AD_IDLE_S*1000) return false; // только в простое
  if(modalOpen) return false;
  if(x2On()) return false;                                // не рвём оплаченный бонус
  return true;
}
function showInterstitial(){
  if(adBusy || !ysdk || !ysdk.adv || !ysdk.adv.showFullscreenAdv) return;
  adBusy=true;
  const finish = wasShown => {
    adBusy=false; audioResume();
    // собственную паузу отсчитываем ОТ ФАКТА показа: при wasShown:false
    // показа не было и ждать полный интервал незачем
    nextAdAt = Date.now() + (wasShown ? AD_GAP_S : AD_RETRY_S)*1000;
  };
  try{
    ysdk.adv.showFullscreenAdv({ callbacks:{
      onOpen: ()=>audioSuspend(),
      onClose: was=>finish(!!was),
      onError: ()=>finish(false),
    }});
  }catch(e){ finish(false); }
}
function maybeInterstitial(){ if(adAllowed()) showInterstitial(); }

function showRewarded(onReward){
  if(!ysdk || !ysdk.adv){ onReward(); return; }   // вне платформы — выдаём сразу
  let paid=false;
  // onError может прийти ПОСЛЕ onRewarded — без флага награда выдастся дважды
  const pay = ()=>{ if(!paid){ paid=true; onReward(); } };
  try{
    ysdk.adv.showRewardedVideo({ callbacks:{
      onOpen:     ()=>audioSuspend(),
      onRewarded: pay,
      onClose:    ()=>audioResume(),
      onError:    ()=>{ audioResume(); pay(); },   // игрок не виноват, что ролик не загрузился
    }});
  }catch(e){ onReward(); }
}

// ---------- Лидерборд ----------
// актуальный API — ysdk.leaderboards.setScore; getLeaderboards() устарел и у
// его объекта методы называются иначе. Поддерживаем оба поколения, приводя к
// одному виду, троттлим запись (лимит 1/с) и не пишем нулевой результат.
let lastLbAt=0, lastLbVal=-1;
function submitScore(v){
  v=Math.floor(v||0); if(v<=0 || v<=lastLbVal) return;
  const now=Date.now(); if(now-lastLbAt<1500) return;
  if(!player || !player.isAuthorized || !player.isAuthorized()) return;  // писать может только авторизованный
  lastLbAt=now; lastLbVal=v;
  try{
    if(lb && typeof lb.setScore==="function") lb.setScore(LB_NAME, v);
    else if(lb && typeof lb.setLeaderboardScore==="function") lb.setLeaderboardScore(LB_NAME, v);
  }catch(e){}
}


// ============================================================
//  МАРШРУТ: движок чек-листа и переезда (playermotivation.md §3, §8)
// ============================================================
// требования, измеряемые в валюте, масштабируются кругом маршрута
const goalReq = (i,k) => {
  const g=GOALS[Math.min(GOALS.length-1,i)][k];
  return g.t==='income' ? g.n*loopScale() : g.n;
};
const goalType = (i,k) => GOALS[Math.min(GOALS.length-1,i)][k].t;
function goalCur(i,k){
  const t=goalType(i,k);
  if(t==='income') return baseIps();     // без временных множителей: цель — устойчивый доход
  if(t==='collect') return collectionCount();
  return GOAL_SRC[t] ? GOAL_SRC[t]() : 0;
}
const goalMet  = (i,k) => goalCur(i,k) >= goalReq(i,k);
const goalsMetAt = i => [0,1,2].every(k=>goalMet(i,k));
const stopReady  = () => goalsMetAt(stopIdx());
const isFinalStop = () => stopIdx() >= ROUTE_N-1;
function goalText(i,k){
  const g=GOALS[Math.min(GOALS.length-1,i)][k];
  if(g.t==='income')  return T("gIncome")+" "+fmt(goalReq(i,k))+" "+T("ipsUnit");
  if(g.t==='collect') return T("gCollect")+" "+g.n;
  return T("g_"+g.t) + (g.n>1 ? " ×"+g.n : "");
}
function goalProgress(i,k){
  const g=GOALS[Math.min(GOALS.length-1,i)][k];
  if(g.n<=1) return goalMet(i,k)?"✓":"—";
  return fmt(Math.min(goalCur(i,k),goalReq(i,k)))+"/"+fmt(goalReq(i,k));
}
// ближайшая незакрытая цель — то, что видно в шапке (средний горизонт)
function nextGoal(){
  const i=stopIdx();
  for(let k=0;k<3;k++) if(!goalMet(i,k)) return {k, text:goalText(i,k), prog:goalProgress(i,k)};
  return null;
}
// награда за остановку — ТОЛЬКО grant, иначе подарки разгоняют прогресс
const stopSeeds = i => (i>=ROUTE_N-1 ? 6 : 2);
function advanceRoute(){
  if(!stopReady()) return false;
  const i=stopIdx();
  S.seeds += stopSeeds(i);
  grant(Math.max(100, baseIps()*180));
  sfx("buy");
  if(isFinalStop()){
    // псевдофинал: настоящий экран «ты дошёл», после него — второй круг.
    // Ничего не отнимаем, прибавка за пройденный путь остаётся навсегда.
    S.loop=Math.min(MAX_LOOP,(S.loop||0)+1); S.finaleSeen=(S.finaleSeen||0)+1;
    S.route=0; S.routeSeen=Math.max(S.routeSeen,1);
    persist(true); refreshHud(); openModal('finale');
    askReview();
    return true;
  }
  S.route=i+1;
  S.routeSeen=Math.min(ROUTE_N-1, Math.max(S.routeSeen, S.route+1));
  persist(true); refreshHud();
  toast(T("movedTo")+" "+T(stop().id));
  rebuildScene();
  openModal('route');
  return true;
}

// ============================================================
//  ОФЛАЙН-ДОХОД (idle-monetization.md §5)
//  Три независимых порога: MIN — с какой отлучки вообще начисляем,
//  CAP — потолок начисления, REPORT — с какой отлучки показываем сводку.
//  CAP > REPORT, иначе появляется мёртвая зона: игрок между ними
//  получает максимум, но окна не видит и не понимает, что игра работала.
// ============================================================
const OFF_MIN_S = 60, OFF_CAP_S = 12*3600, OFF_REPORT_S = 4*3600;
const FF_STEP = 15;
// Предел шагов выводим ИЗ потолка, а не пишем числом — иначе они разъедутся
// и потолок молча обрежется.
const FF_MAX_STEPS = Math.ceil(OFF_CAP_S/FF_STEP) + 10;
let catchUp=false;               // идёт досчёт: без сейвов, звука, частиц и целей
let offlineReport=null;

function fastForward(seconds){
  catchUp=true; window.__silent=true;
  try{
    let rem=seconds, guard=0;
    while(rem>0 && guard++<FF_MAX_STEPS){ simulateTick(Math.min(FF_STEP,rem)); rem-=FF_STEP; }
  } finally { catchUp=false; window.__silent=false; }
}
function checkOffline(){
  const now=Date.now();
  const last=S.lastSeen||0;
  S.lastSeen=now;
  if(!last) return false;
  const away=Math.floor((now-last)/1000);
  if(away<OFF_MIN_S) return false;
  const capped = away>OFF_CAP_S;
  const used = Math.min(away, OFF_CAP_S);
  const before=S.coins;
  fastForward(used);
  const gained=S.coins-before;
  offlineReport={away, used, capped, gained, x2Taken:false};
  return away>=OFF_REPORT_S || gained>0;
}
// Прогноз показываем, ТОЛЬКО когда доход реально пойдёт. Если условий нет —
// пустая строка, а не уговоры «купи ещё»: реклама своих механик раздражает.
function offlineForecast(){
  if(baseIps()<=0) return "";
  return T("offForecast")+fmt(baseIps()*3600)+"/"+T("hOur");
}

// ============================================================
//  ЕЖЕДНЕВНАЯ СЕРИЯ (idle-monetization.md §4)
//  Цикл 7 дней, награда привязана к текущему темпу игрока (фиксированная
//  сумма через месяц превращается в мусор), день определяем по строке
//  даты, а не по таймстемпу — иначе «сутки» ездят.
// ============================================================
const dayKey = d => new Date(d).toISOString().slice(0,10);
const dailyReward = i => Math.max(120, Math.round(baseIps()*60*(2+i)));
const dailySeeds  = i => (i===2||i===6) ? 1 : 0;    // премиальная валюта на 3-й и 7-й день
let dailyPending=false;
function checkDaily(){
  const today=dayKey(Date.now());
  if(S.daily.day===today){ dailyPending=false; return false; }
  // окно «Серия: 1 день» на самом первом запуске выглядит абсурдно и перекрывает
  // обучение — показываем только тем, у кого уже есть прогресс
  if(!hasProgress()){ dailyPending=false; return false; }
  const yest=dayKey(Date.now()-86400000);
  S.daily.streak = (S.daily.day===yest) ? Math.min(7, S.daily.streak+1) : 1;
  dailyPending=true;
  return true;
}
function claimDaily(x2){
  if(!dailyPending) return;
  const i=Math.max(0,Math.min(6,S.daily.streak-1));
  const give = ()=>{
    grant(dailyReward(i)*(x2?2:1));                 // подарок — grant, не earn
    S.seeds += dailySeeds(i);
    S.daily.day=dayKey(Date.now()); dailyPending=false;
    refreshHud(); persist(true); sfx("coin"); closeModal();
    maybeInterstitial();                            // закрытие окна — естественная пауза
  };
  if(x2) showRewarded(give); else give();
}

// ============================================================
//  ПОДСКАЗКИ (idle-monetization.md §7)
//  Отдельная от обучения система: триггеры условные, а не последовательные,
//  и показываются ВСЕМ, включая давних игроков, — они и есть основная
//  аудитория. По одной за раз и один раз навсегда.
// ============================================================
let tipNow=null, tipTimer=0;
function showTip(tip){
  const el=$("bubble"), tgt=$(tip.target);
  if(!el||!tgt) return;
  tipNow=tip;
  el.textContent=tip.text();
  const r=tgt.getBoundingClientRect();
  const side = r.left > innerWidth*0.55;
  el.className = "bubble" + (side?" side":"");
  // Ширина пузыря задана в CSS явно: браузер считает её из остатка места
  // справа от left ДО применения transform, и у кнопки в правой части экрана
  // текст схлопнулся бы в колонку по слову в строке.
  el.style.left = (side ? r.left-8 : r.left+r.width/2)+"px";
  el.style.top  = (side ? r.top+r.height/2 : r.top-10)+"px";
  el.hidden=false;
  tgt.classList.add("tipTarget");
  clearTimeout(tipTimer); tipTimer=setTimeout(closeTip, 11000);
}
function closeTip(){
  if(!tipNow) return;
  const tgt=$(tipNow.target); if(tgt) tgt.classList.remove("tipTarget");
  S.tips[tipNow.id]=true; tipNow=null;
  const el=$("bubble"); if(el) el.hidden=true;
  persist(true);
}
function tipTick(){
  if(tipNow || !booted) return;
  if(modalOpen || dailyPending || offlineReport) return;   // окно возвращения → ежедневка → подсказка
  if(!S.hintShown) return;                                 // во время обучающей подсказки молчим
  const tip=TIPS.find(x=> !S.tips[x.id] && x.when());
  if(tip) showTip(tip);
}
// любое действие игрока снимает подсказку: она уже сделала своё дело
document.addEventListener('pointerdown', ()=>{ if(tipNow) closeTip(); }, true);

// ============================================================
//  ЯРЛЫК НА ГЛАВНЫЙ ЭКРАН И ЗАПРОС ОЦЕНКИ (idle-monetization.md §6)
// ============================================================
async function maybeShortcut(){
  if(S.shortcutAsked || !ysdk || !ysdk.shortcut) return;
  try{
    const r=await ysdk.shortcut.canShowPrompt();
    if(r && r.canShow) openModal('shortcut');
  }catch(e){}
}
async function doShortcut(){
  S.shortcutAsked=true; persist(true);
  try{
    // showPrompt() открывает нативный диалог — зовём строго из обработчика нажатия,
    // иначе браузер может его не показать
    const res=await ysdk.shortcut.showPrompt();
    if(res && res.outcome==='accepted'){ S.seeds+=1; refreshHud(); persist(true); toast(T("seedGot")+" +1"); }
  }catch(e){}

async function askReview(){
  if(S.reviewAsked || !ysdk || !ysdk.feedback) return;
  S.reviewAsked=true; persist(true);
  try{
    const can=await ysdk.feedback.canReview();     // обязателен перед requestReview
    if(can && can.value) await ysdk.feedback.requestReview();
  }catch(e){}

// ── подсказки: условные триггеры, показываются всем, включая давних игроков ──
const TIPS = [
  { id:'x2',  target:'x2Btn',    text:()=>T("tipX2"),     when:()=> S.toppings.length>=1 && !x2On() },
  { id:'map', target:'routeChip',text:()=>T("tipMap"),    when:()=> S.drops>=8 },
  { id:'off', target:'shopBtn',  text:()=>T("tipOffline"),when:()=> baseIps()>0 && S.toppings.length>=2 },
  // прогон «упрямой» стратегии показал: одних новых видов мало, доход держат
  // ВТОРЫЕ банки уже открытых начинок — это надо объяснить, а не оставлять на догадку
  { id:'jar', target:'shopBtn',  text:()=>T("tipJar"),    when:()=> S.toppings.length>=2 && farmTotal()<=S.toppings.length },
  { id:'seed',target:'upBtn',    text:()=>T("tipSeeds"),  when:()=> S.seeds>0 && S.seedsUsed===0 },
];

// ── один шаг собственной симуляции игры (его же крутит досчёт офлайна) ──
// Твист «помощник с половником» работает и офлайн, но НЕ засчитывается в цели
// чек-листа: иначе за ночь автоматика закрывает их сама.
const AUTO_EVERY = 12;
let autoAcc = 0;
function simulateTick(sec){
  earn(baseIps()*sec);
  if(hasTwist('w1')){
    autoAcc+=sec;
    while(autoAcc>=AUTO_EVERY){ autoAcc-=AUTO_EVERY; autoDrop(); }
  }
}
// сцену пересобираем при переезде — палитра места меняется
function rebuildScene(){ if(catchUp) return; rebuildBg(); }
function finaleArt(){
  const c=document.createElement('canvas'); c.width=220; c.height=150;
  c.style.cssText="width:100%;max-width:220px;display:block;margin:0 auto 6px";
  try{ const g=c.getContext('2d'); drawTopping(g, TOPPINGS[TOPPINGS.length-1], 110, 80, 2.6); }catch(e){}
  return c;
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
// Округляем ТОЛЬКО при показе — начисления остаются дробными.
// Суффиксов хватает далеко за пределы Number.MAX_SAFE_INTEGER, иначе
// форматирование выдаёт «1000T» и выглядит недоделкой.
const SUFFIX = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n){
  n = Number(n)||0;
  if(n<1000) return Math.floor(n).toString();
  let i=0; while(n>=1000 && i<SUFFIX.length-1){ n/=1000; i++; }
  return (n<10 ? n.toFixed(2) : n<100 ? n.toFixed(1) : Math.floor(n).toString()) + SUFFIX[i];
}
function fmtDur(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  return h>0 ? (h+" "+T("hOur")+(m?" "+m+" "+T("hMin"):"")) : (m+" "+T("hMin"));
}
function curHeight(){ return S.stack? S.stack.length-1 : 0; }
function refreshHud(){
  if(catchUp) return;   // досчёт зовёт обычный игровой шаг — интерфейс ему не нужен
  $("coinsV").textContent = fmt(S.coins);
  $("heightV").textContent = curHeight();
  $("coinsL").textContent = T("coins");
  $("heightL").textContent = T("height");
  $("giftT").textContent  = T("gift");
  $("giftS").textContent  = "+"+fmt(giftAmt());
  const on=x2On();
  $("x2T").textContent    = on? T("x2on") : T("x2");
  $("x2S").textContent    = on? Math.ceil((S.x2Until-Date.now())/60000)+(lang()==="ru"?" мин":" min") : (lang()==="ru"?"5 мин":"5 min");
  $("x2Btn").classList.toggle("off", on);
  $("langTxt").textContent = lang()==="ru" ? "RU" : "EN";
  // премиальная валюта появляется в шапке только когда она у игрока есть
  const sc=$("seedChip"); sc.hidden = !(S.seeds>0 || S.seedsUsed>0);
  $("seedV").textContent = fmt(S.seeds); $("seedL").textContent = T("seeds");
  refreshRouteBar();
  document.documentElement.setAttribute("lang", lang());
  if(modalOpen) buildModal(modalOpen);
}
// средний горизонт: текущее место, три точки чек-листа и ближайшая цель
function refreshRouteBar(){
  const i=stopIdx();
  $("rbName").textContent = T(ROUTE[i].id);
  $("rbNum").textContent  = (i+1)+"/"+ROUTE_N + ((S.loop>0)?(" · "+T("loopWord")+" "+(S.loop+1)):"");
  for(let k=0;k<3;k++) $("rd"+k).classList.toggle("on", goalMet(i,k));
  const g=nextGoal(), row=$("rbGoal");

  else { $("rbGoalT").textContent=T("moveOn")+" →"; $("rbGoalV").textContent="✓"; row.classList.add("ready"); }
}
let toastT;
function toast(msg){ if(catchUp) return; const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1600); }

// ---------- Награды ----------
const giftAmt = () => Math.max(80, Math.round(baseIps()*45));

// ---------- Действия: покупки ----------
// Банок одной начинки можно набрать сколько угодно: каждая капает мёдом,
// цена следующей растёт мелким множителем. Первая банка вида ещё и открывает
// постоянную прибавку к выручке за укладку.
function buyTopping(id){
  const sp=TI(id); if(!sp) return false;
  if(TOPPINGS.indexOf(sp) >= itemsUnlocked()) return false;   // вид открывается местом маршрута
  const c=toppingCost(sp);
  if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  spend(c);
  S.jars[id]=jarCount(id)+1;
  const first = !S.toppings.includes(id);
  if(first){ S.toppings.push(id); toast(T("newTopping")+" "+nm(sp)); }
  else toast(T("bought")+" "+nm(sp)+" ×"+jarCount(id));
  if(S.toppings.length>=TOPPINGS.length && first) setTimeout(()=>toast(T("allToppings")), 700);
  refreshHud(); persist(true); if(first) rebuildBg(); sfx("buy");
  return true;
}
function plantSeed(){
  if(S.seeds<=0){ toast(T("seedNone")); sfx("error"); return false; }
  S.seeds--; S.seedsUsed++;
  refreshHud(); persist(true); sfx("buy");
  return true;
}
function buyUp(key){
  const map={upSteady:steadyCost,upTray:trayCost,upEye:eyeCost};
  const max={upSteady:MAX_STEADY,upTray:MAX_TRAY,upEye:MAX_EYE};
  if(S[key]>=max[key]) return false;
  const c=map[key](); if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  spend(c); S[key]++; refreshHud(); persist(true); sfx("buy"); return true;
}
function claimGift(){
  showRewarded(()=>{ const g=giftAmt(); grant(g); refreshHud(); persist(true); sfx("coin");
    toast(T("giftGot")+" +"+fmt(g)); });
}
function claimX2(){
  if(x2On()){ toast(T("x2on")); return; }
  showRewarded(()=>{ S.x2Until=Date.now()+300000; refreshHud(); persist(true); sfx("buy");
    toast(T("x2got")); });
}

      el.className="stop"+(isCur?" cur":done?" done":fog?" fog":"");
      const num=document.createElement('div'); num.className="num"; num.textContent=done?"✓":(i+1); el.appendChild(num);

      const nm=document.createElement('div'); nm.className="sn"; nm.textContent= fog? T("stopLocked") : T(r.id); sb.appendChild(nm);
      const sw=document.createElement('div'); sw.className="sw";
      sw.textContent = fog? "—" : (r.twist==='w0' ? T(r.twist) : T("twistWord")+": "+T(r.twist));

      if(isCur){

                                  : (T("goalsLeft")+": "+[0,1,2].filter(k=>!goalMet(cur,k)).length);
    btn.onclick=()=>{ if(stopReady()) advanceRoute(); else sfx("error"); };
    body.appendChild(btn);
    const note=document.createElement('div'); note.className="note"; note.textContent=T("bringsAlong");
    body.appendChild(note);

  } else if(kind==='finale'){
    // ── псевдофинал: закрытие есть, но игра продолжается ──
    $("mTitle").textContent=T("finaleTitle"); body.innerHTML="";
    const th=finaleArt(); if(th) body.appendChild(th);
    const note=document.createElement('div'); note.className="note"; note.textContent=T("finaleText");
    body.appendChild(note);
    const btn=document.createElement('button'); btn.className="wide okb"; btn.textContent=T("finaleGo");
    btn.onclick=()=>{ closeModal(); rebuildScene(); refreshHud(); maybeInterstitial(); };
    body.appendChild(btn);

  } else if(kind==='offline'){
    // ── окно возвращения: построчно, ЧТО ИМЕННО накопилось ──
    const r=offlineReport||{away:0,used:0,gained:0,capped:false};
    $("mTitle").textContent=T("offTitle"); body.innerHTML="";
    const head=document.createElement('div'); head.className="note";
    head.textContent=T("offAway")+" "+fmtDur(r.away);
    body.appendChild(head);
    const line=(ic,label,val)=>{
      const el=document.createElement('div'); el.className="offline";

    // строки должны В СУММЕ давать «Всего» — иначе окно читается как ошибка счёта
    const mult = permMult();
    const parts = ITEMS.map(it=>({it, v: farmCount(it.id)*it.ips*mult*r.used}))
                       .filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    parts.slice(0,4).forEach(x=> line(ITEM_ICON, T(x.it.id)+" ×"+fmt(farmCount(x.it.id)), "+"+fmt(x.v)));
    if(parts.length>4){
      const rest=parts.slice(4).reduce((a,x)=>a+x.v,0);
      line(ITEM_ICON2, T("otherItems")+" ×"+(parts.length-4), "+"+fmt(rest));
    }
    line("🪙", T("offTotal"), "+"+fmt(r.gained));
    // если потолок был достигнут — сказать об этом, иначе читается как поломка
    if(r.capped){ const n=document.createElement('div'); n.className="note"; n.textContent=T("offCap"); body.appendChild(n); }
    const b1=document.createElement('button'); b1.className="wide okb"; b1.textContent=T("offClaimX2");
    b1.onclick=()=>{ if(offlineReport && !offlineReport.x2Taken){ offlineReport.x2Taken=true;
        showRewarded(()=>{ grant(offlineReport.gained); refreshHud(); persist(true); sfx("coin"); closeModal(); }); } };
    body.appendChild(b1);
    const b2=document.createElement('button'); b2.className="wide ghost"; b2.textContent=T("offClaim");
    b2.onclick=()=>{ closeModal(); };
    body.appendChild(b2);

  } else if(kind==='daily'){
    // ── ежедневная серия: 7 дней, награда от текущего темпа игрока ──
    $("mTitle").textContent=T("dailyTitle"); body.innerHTML="";
    const head=document.createElement('div'); head.className="note";
    head.textContent=T("dailyStreak")+": "+S.daily.streak+"/7";
    body.appendChild(head);
    const row=document.createElement('div'); row.className="dayrow";
    for(let i=0;i<7;i++){
      const c=document.createElement('div');
      c.className="dayc"+(i<S.daily.streak-1?" past":i===S.daily.streak-1?" cur":"");
      c.innerHTML=T("dailyDay")+" "+(i+1)+'<span class="dv"></span>';
      c.querySelector('.dv').textContent = dailySeeds(i)? "★" : fmt(dailyReward(i));
      row.appendChild(c);
    }
    body.appendChild(row);
    const b1=document.createElement('button'); b1.className="wide okb"; b1.textContent=T("dailyTakeX2");
    b1.onclick=()=>claimDaily(true); body.appendChild(b1);
    const b2=document.createElement('button'); b2.className="wide ghost"; b2.textContent=T("dailyTake");
    b2.onclick=()=>claimDaily(false); body.appendChild(b2);

  } else if(kind==='shortcut'){
    $("mTitle").textContent=T("scTitle"); body.innerHTML="";
    const n=document.createElement('div'); n.className="note"; n.textContent=T("scText"); body.appendChild(n);
    const b1=document.createElement('button'); b1.className="wide okb"; b1.textContent=T("scAdd");
    b1.onclick=doShortcut; body.appendChild(b1);
    const b2=document.createElement('button'); b2.className="wide ghost"; b2.textContent=T("later");
    b2.onclick=()=>{ S.shortcutAsked=true; persist(true); closeModal(); }; body.appendChild(b2);

  } else if(kind==='shelf'){
    $("mTitle").textContent=T("shelfTitle")+" ("+S.toppings.length+"/"+TOPPINGS.length+")"; body.innerHTML="";
    const hn=document.createElement('div'); hn.className="note";
    hn.textContent=T("shelfBonus")+" ×"+toppingMult().toFixed(2); body.appendChild(hn);
    const grid=document.createElement('div'); grid.className="coll";
    TOPPINGS.forEach(sp=>{
      const seen=S.toppings.includes(sp.id);
      const card=document.createElement('div'); card.className="card"+(seen?"":" locked");
      if(seen){

        const n=document.createElement('div'); n.className="cn"; n.textContent=nm(sp); card.appendChild(n);
      } else {
        const q=document.createElement('div'); q.className="qm"; q.textContent="?"; card.appendChild(q);
        const n=document.createElement('div'); n.className="cn"; n.textContent="—"; card.appendChild(n);
      }
      grid.appendChild(card);
    });
    body.appendChild(grid);
  }
}

// ---------- Canvas ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1, groundY=0, charScale=1;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let INK="#5C3B23", PAPER="#FFF7E8";
let bgCan=null, fgCan=null;

// ── обязательные цветовые хелперы (RUNBOOK «Модельки: стандарт качества») ──
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function shade(hex, amt){
  const [r,g,b]=hexRgb(hex);
  const f=v=>Math.max(0,Math.min(255,Math.round(amt>=0 ? v+(255-v)*amt : v*(1+amt))));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgba(hex, a){ const [r,g,b]=hexRgb(hex); return 'rgba('+r+','+g+','+b+','+a+')'; }
function sphereFill(g,cx,cy,r,base){
  const grad=g.createRadialGradient(cx-r*0.35,cy-r*0.5,r*0.1,cx,cy,r*1.15);
  grad.addColorStop(0,shade(base,.42)); grad.addColorStop(.55,base); grad.addColorStop(1,shade(base,-.22));
  return grad;
}
function vertFill(g,x0,y0,x1,y1,base){
  const grad=g.createLinearGradient(x0,y0,x1,y1);
  grad.addColorStop(0,shade(base,.32)); grad.addColorStop(1,shade(base,-.2));
  return grad;
}
function glossSpot(g,cx,cy,r){
  const grad=g.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'rgba(255,255,255,.62)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  return grad;
}
function rimShadeRect(g,x,y,w,h){
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip();
  const grad=g.createLinearGradient(x,y+h*0.35,x,y+h);
  grad.addColorStop(0,'rgba(30,16,6,0)'); grad.addColorStop(1,'rgba(30,16,6,.30)');
  g.fillStyle=grad; g.fillRect(x,y,w,h);
  g.restore();
}
function rimShadeEllipse(g,cx,cy,rx,ry){
  g.save(); g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,6.28); g.clip();
  const grad=g.createLinearGradient(cx,cy+ry*0.1,cx,cy+ry);
  grad.addColorStop(0,'rgba(30,16,6,0)'); grad.addColorStop(1,'rgba(30,16,6,.28)');
  g.fillStyle=grad; g.fillRect(cx-rx,cy-ry,rx*2,ry*2);
  g.restore();
}

// ---------- Раскладка сцены ----------
let plateX=0, groundYv=0, windowCX=0, windowCY=0, windowRX=0, windowRY=0;
let catX=0, catY=0, samX=0, samY=0, layerH=26, ampX=0, viewTopY=0;
function rr(a,b){ return a+(b-a)*Math.random(); }
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  charScale=Math.max(0.86, Math.min(1.7, W/460));
  groundY=H*0.72;
  windowCX=W*0.5; windowCY=H*0.19; windowRX=Math.min(W*0.30,210); windowRY=Math.min(H*0.15,170);
  catX=windowCX+windowRX*0.92; catY=windowCY+windowRY*0.62;
  samX=W*0.16; samY=groundY;
  layerH=Math.max(18,Math.min(30,H*0.052));
  ampX=Math.min(W*0.32,160);
  viewTopY=H*0.48;
  plateX=W*0.5;
  INK=cssVar("--ink")||INK; PAPER=cssVar("--paper")||PAPER;
  buildScenery();
  buildBg(); buildFg(); rebuildBg();
  if(!S.stack) startRound(true);
}
addEventListener("resize",resize);

// ---------- Живой мир: пар самовара, кот, занавески, пчела ----------
let steamP=[], curtainPh=0, beePhase=0, catBreath=0;
function buildScenery(){
  steamP=[]; for(let i=0;i<6;i++) steamP.push({x:samX+rr(-4,4),y:samY-rr(0,40),life:rr(0,2),spd:rr(10,16)});
  curtainPh=0; beePhase=rr(0,6.28); catBreath=0;
}
function baseW(){ return Math.min(W*0.30, 140*charScale) * (1+0.06*S.upTray) * panWide(); }   // «широкая сковорода» — твист места

function drawSamovarStatic(g){
  const s=34*charScale, x=samX, y=samY;
  g.strokeStyle=INK; g.lineWidth=2.4;
  g.fillStyle=sphereFill(g,x,y-s*1.3,s*0.62,'#C99A4E');
  g.beginPath(); g.ellipse(x,y-s*1.2,s*0.62,s*0.82,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle=vertFill(g,x-s*0.35,y-s*0.5,x+s*0.35,y,'#B9843C');
  g.beginPath(); g.moveTo(x-s*0.5,y-s*0.5); g.lineTo(x-s*0.4,y); g.lineTo(x+s*0.4,y); g.lineTo(x+s*0.5,y-s*0.5); g.closePath();
  g.fill(); g.stroke();
  g.fillStyle='#8A6230'; g.beginPath(); g.ellipse(x,y,s*0.55,s*0.14,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle='#D9AE63'; g.beginPath(); g.arc(x,y-s*2.0,s*0.16,0,6.28); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x,y-s*1.85); g.lineTo(x,y-s*1.65); g.stroke();
  g.strokeStyle=shade('#8A6230',-.2); g.lineWidth=s*0.14; g.lineCap='round';
  g.beginPath(); g.moveTo(x-s*0.6,y-s*1.1); g.quadraticCurveTo(x-s*0.95,y-s*1.05,x-s*0.9,y-s*0.75); g.stroke();
}
function drawCatWindowsill(g,cx,cy,scale,breath){
  g.save(); g.translate(cx,cy); g.scale(scale,scale);
  const b=1+Math.sin(breath)*0.035;
  g.strokeStyle=INK; g.lineWidth=2.2;
  g.fillStyle=sphereFill(g,-2,-2,16*b,'#D9C7A8');
  g.beginPath(); g.ellipse(0,0,18*b,12*b,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle=sphereFill(g,-14,-16,7,'#D9C7A8');
  g.beginPath(); g.ellipse(-13,-15,7.5,7,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle='#D9C7A8'; g.beginPath(); g.moveTo(-19,-19); g.lineTo(-16,-27); g.lineTo(-13,-20); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-11,-20); g.lineTo(-8,-27); g.lineTo(-6,-19); g.closePath(); g.fill(); g.stroke();
  g.fillStyle='#F0C9C9'; g.beginPath(); g.moveTo(-17,-20); g.lineTo(-15.4,-24); g.lineTo(-13.6,-20); g.closePath(); g.fill();
  g.strokeStyle=shade('#D9C7A8',-.3); g.lineWidth=2; g.lineCap='round';
  g.beginPath(); g.moveTo(15,-2); g.quadraticCurveTo(24,-6,22,-14); g.stroke();
  g.fillStyle='#3A2E22'; g.beginPath(); g.arc(-15.5,-16,0.9,0,6.28); g.fill();
  g.beginPath(); g.arc(-10.5,-16,0.9,0,6.28); g.fill();
  g.restore();
}
function buildBg(){
  bgCan=document.createElement('canvas'); bgCan.width=Math.max(1,W*DPR); bgCan.height=Math.max(1,H*DPR);
  const g=bgCan.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  const wall=g.createLinearGradient(0,0,0,groundY);
  wall.addColorStop(0,'#FBEBC4'); wall.addColorStop(1,'#F3D69A');
  g.fillStyle=wall; g.fillRect(0,0,W,groundY);
  // окно с аркой
  g.save();
  g.beginPath();
  g.moveTo(windowCX-windowRX,windowCY+windowRY);
  g.lineTo(windowCX-windowRX,windowCY);
  g.quadraticCurveTo(windowCX-windowRX,windowCY-windowRY*1.15,windowCX,windowCY-windowRY*1.15);
  g.quadraticCurveTo(windowCX+windowRX,windowCY-windowRY*1.15,windowCX+windowRX,windowCY);
  g.lineTo(windowCX+windowRX,windowCY+windowRY);
  g.closePath();
  g.fillStyle=INK; g.fill();
  g.clip();
  const sky=g.createLinearGradient(0,windowCY-windowRY*1.2,0,windowCY+windowRY);
  sky.addColorStop(0,'#BFE0F2'); sky.addColorStop(0.6,'#E9F3D8'); sky.addColorStop(1,'#CFE7A6');
  g.fillStyle=sky; g.fillRect(windowCX-windowRX-4,windowCY-windowRY*1.3,windowRX*2+8,windowRY*2.4);
  const sx=windowCX+windowRX*0.5, sy=windowCY-windowRY*0.6, sr=windowRX*0.22;
  const sg=g.createRadialGradient(sx,sy,0,sx,sy,sr*2.4);
  sg.addColorStop(0,'rgba(255,248,214,.95)'); sg.addColorStop(0.4,'rgba(255,232,170,.5)'); sg.addColorStop(1,'rgba(255,232,170,0)');
  g.fillStyle=sg; g.beginPath(); g.arc(sx,sy,sr*2.4,0,6.28); g.fill();
  g.fillStyle='#FFF6DC'; g.beginPath(); g.arc(sx,sy,sr,0,6.28); g.fill();
  g.fillStyle='#8FAE6E';
  g.beginPath(); g.moveTo(windowCX-windowRX,windowCY+windowRY);
  for(let x=-windowRX;x<=windowRX;x+=windowRX/6){ g.quadraticCurveTo(windowCX+x+windowRX/12,windowCY+windowRY*0.62,windowCX+x+windowRX/6,windowCY+windowRY*0.78); }
  g.lineTo(windowCX+windowRX,windowCY+windowRY*1.3); g.lineTo(windowCX-windowRX,windowCY+windowRY*1.3); g.closePath(); g.fill();
  g.strokeStyle='#5C7A3E'; g.lineWidth=2;
  [[-0.6,'#6B8A46'],[0.55,'#6B8A46']].forEach(t=>{
    const tx=windowCX+windowRX*t[0], ty=windowCY+windowRY*0.55;
    g.fillStyle=t[1]; g.beginPath(); g.arc(tx,ty-14,12,0,6.28); g.fill();
    g.fillStyle='#7A5A34'; g.fillRect(tx-2,ty-4,4,16);
  });
  g.restore();
  g.strokeStyle=INK; g.lineWidth=5;
  g.beginPath();
  g.moveTo(windowCX-windowRX,windowCY+windowRY);
  g.lineTo(windowCX-windowRX,windowCY);
  g.quadraticCurveTo(windowCX-windowRX,windowCY-windowRY*1.15,windowCX,windowCY-windowRY*1.15);
  g.quadraticCurveTo(windowCX+windowRX,windowCY-windowRY*1.15,windowCX+windowRX,windowCY);
  g.lineTo(windowCX+windowRX,windowCY+windowRY);
  g.stroke();
  g.beginPath(); g.moveTo(windowCX,windowCY-windowRY*1.1); g.lineTo(windowCX,windowCY+windowRY); g.lineWidth=3; g.stroke();
  // подоконник
  g.fillStyle=vertFill(g,0,windowCY+windowRY,0,windowCY+windowRY+14,'#D9AE63');
  g.fillRect(windowCX-windowRX-10,windowCY+windowRY,windowRX*2+20,14);
  g.strokeStyle=INK; g.lineWidth=2; g.strokeRect(windowCX-windowRX-10,windowCY+windowRY,windowRX*2+20,14);
  drawCatWindowsill(g, catX, catY, 1.5*charScale, 0);
  // полка вкусов: открытые начинки стоят на подоконнике слева от кота
  if(S.toppings.length){
    const n=S.toppings.length, totalW=Math.min(windowRX*1.55, 30*n), gap=totalW/n;
    const startX = windowCX - windowRX*0.92 + gap*0.5;
    S.toppings.forEach((id,i)=>{ drawJar(g, startX+i*gap, catY+2, 0.62, TI(id)); });
  }
  // самовар

function autoDrop(){
  if(!S.stack || !S.stack.length) return false;
  const top=S.stack[S.stack.length-1];
  earn(dropBase());
  S.stack.push({w:top.w, x:top.x, c:S.stack.length%4});
  if(S.stack.length>60) S.stack=S.stack.slice(-40);   // очередь всегда ограничена

function scrollY(){ const span=groundY-viewTopY; return Math.max(0, topScrollWorldY()-span); }
function layerScreenY(i){ // i = индекс слоя (0 = первый на тарелке); возвращает {top,bot}
  const sc=scrollY();

const PANC_COLORS=['#EEB85C','#E8A33D','#F2C97A','#DC9A3E'];
function drawPancakeShape(g,x,y,w,h,colBase,wobbleSeed){
  // блин рисуется как «пак»: золотистый верх (эллипс) + подрумяненный
  // боковой торец снизу — даёт видимую толщину при виде почти сбоку,
  // как у настоящей стопки блинов.
  const rx=Math.max(4,w/2), ry=Math.max(3,h*0.30), side=h*0.58;
  g.save(); g.translate(x,y);
  const under=shade(colBase,-.22);
  g.fillStyle=under;
  g.beginPath(); g.rect(-rx,0,rx*2,side); g.fill();
  g.beginPath(); g.ellipse(0,side,rx,ry,0,0,6.283); g.fill();
  g.strokeStyle=INK; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(-rx,0); g.lineTo(-rx,side); g.stroke();
  g.beginPath(); g.moveTo(rx,0); g.lineTo(rx,side); g.stroke();
  g.beginPath(); g.ellipse(0,side,rx,ry,0,0,Math.PI); g.stroke();
  g.fillStyle=rgba('#000',.14);
  g.beginPath(); g.ellipse(0,side,rx*0.94,ry*0.8,0,0,Math.PI); g.fill();
  // верхняя золотистая поверхность
  g.fillStyle=sphereFill(g,-rx*0.28,-ry*0.35,Math.max(rx,ry)*1.1,colBase);
  g.beginPath(); g.ellipse(0,0,rx,ry,0,0,6.283); g.fill(); g.stroke();
  g.save(); g.beginPath(); g.ellipse(0,0,rx,ry,0,0,6.283); g.clip();
  g.fillStyle=glossSpot(g,-rx*0.32,-ry*0.4,rx*0.55);
  g.beginPath(); g.ellipse(-rx*0.28,-ry*0.3,rx*0.42,ry*0.55,-0.3,0,6.28); g.fill();
  g.fillStyle=rgba('#8A5A24',.4);
  for(let k=0;k<4;k++){ const dx=Math.sin(wobbleSeed*3+k*2.1)*rx*0.55, dy=Math.cos(wobbleSeed*2+k*1.7)*ry*0.45;
    g.beginPath(); g.arc(dx,dy,rx*0.05+1,0,6.28); g.fill(); }

function doDrop(){
  if(roundState!=='play' || !mover) return;
  const top=S.stack[S.stack.length-1], pos=layerScreenY(S.stack.length-1);
  const mx=moverX(), mw=mover.w;
  const l1=mx-mw/2, r1=mx+mw/2, l2=top.x-top.w/2, r2=top.x+top.w/2;
  const ol=Math.max(l1,l2), or_=Math.min(r1,r2);
  const overlapW=Math.max(0,or_-ol);
  const ratio=overlapW/mw;
  const dropY=(pos.top+pos.bot)/2 - layerH*1.1;
  sfx("tap");
  if(overlapW < 8*charScale || ratio < missRatio){
    if(S.roundSaves>0){
      S.roundSaves--; S.combo=0;
      const newW=top.w, newX=top.x;
      S.stack.push({w:newW,x:newX,c:S.stack.length%4});
      toast(T("saved"));
      burstFx(mx,dropY,'#B497D6','+0');
      spawnMover(); refreshHud(); persist();
      return;
    }
    // промах: стопка падает
    fallPiece={x:mx,y:dropY,vx:(mx<top.x?-60:60),vy:-40,vr:(mx<top.x?-3:3),rot:0,w:mw,c:mover.c,life:1.1};
    roundState='fall'; mover=null; sfx("error");
    const h=curHeight();
    S.bestHeight=Math.max(S.bestHeight,h); submitScore(S.bestHeight);
    S.maxCombo=Math.max(S.maxCombo, S.combo);
    toast(T("fell")+" "+h);
    persist(true);
    setTimeout(()=>{ startRound(false); roundState='play'; refreshHud(); }, 1150);
    return;
  }
  // успех
  const isPerfect = ratio >= perfectRatio();
  const newW = isPerfect ? top.w : overlapW;
  const newX = isPerfect ? top.x : (ol+or_)/2;
  if(isPerfect) S.combo++; else S.combo=0;
  const golden=goldenDrop();
  const gain=dropGain();
  earn(gain); S.drops++;
  S.maxCombo=Math.max(S.maxCombo, S.combo);
  S.stack.push({w:newW,x:newX,c:S.stack.length%4});
  // «двойная порция» (твист последнего места) кладёт второй блин сразу
  if(dropsPerTap()>1){
    earn(dropBase()*(x2On()?2:1)); S.drops++;
    S.stack.push({w:newW,x:newX,c:S.stack.length%4});
  }
  S.bestHeight=Math.max(S.bestHeight, curHeight());
  // крошки от срезанного края
  if(!isPerfect){
    if(l1<l2) crumbFx(l1+ (l2-l1)/2, dropY, PANC_COLORS[mover.c%PANC_COLORS.length]);
    if(r1>r2) crumbFx(r1-(r1-r2)/2, dropY, PANC_COLORS[mover.c%PANC_COLORS.length]);
  }
  burstFx(newX,dropY,(isPerfect||golden)?'#F2C14E':'#E8A33D','+'+fmt(gain)+(isPerfect?' '+T('perfect'):''));
  sfx((isPerfect||golden)?"coin":"tap");
  if(!S.hintDropShown){ S.hintDropShown=true; }
  refreshHud(); persist();
  spawnMover();
}

// ---------- Кадр ----------
let lastT=performance.now();
let hudAcc=0, tipAcc=0;
function frame(now){
  let dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now;
  const t=now/1000;
  if(mover && roundState==='play') mover.phase += dt*mover.speed;
  if(baseIps()>0) earn(ips()*dt);        // производство — earn, подарки — grant
  if(hasTwist('w1')){ autoAcc+=dt; while(autoAcc>=AUTO_EVERY){ autoAcc-=AUTO_EVERY; autoDrop(); } }
  hudAcc+=dt; if(hudAcc>=0.5){ hudAcc=0; refreshHud(); persist(); }
  tipAcc+=dt; if(tipAcc>=1){ tipAcc=0; tipTick(); maybeInterstitial(); }
  updateFx(dt);

  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawCurtains(t);
  drawSteam(dt);
  drawBee(t);
  drawStack(t);
  drawMover(t);
  if(fallPiece) drawFalling(dt);
  drawFx();
  if(fgCan) ctx.drawImage(fgCan,0,0,W,H);
  requestAnimationFrame(frame);
}

// ---------- Ввод: тап в любое место игрового поля роняет блин ----------
function toLogical(clientX,clientY){ const r=cv.getBoundingClientRect(); return {x:clientX-r.left, y:clientY-r.top}; }
cv.addEventListener("pointerdown", e=>{
  const p=toLogical(e.clientX,e.clientY);
  if(p.y > groundY+40) return; // тап по столу вне игровой зоны — игнор
  doDrop();
});

// ============================================================
//  Бот для прогона баланса (idle-economy-balance.md §10.3)
//  Гоняет ту же симуляцию, что и игра, без интерфейса, и возвращает
//  таблицу «время до вех» в минутах активной игры. Бот кладёт блины
//  идеально — это верхняя граница мастерства, а не средний игрок.
// ============================================================
function botOptions(){
  const base=Math.max(1e-6, baseIps()), o=[];
  if(S.upTray  <MAX_TRAY)   o.push({k:'up',key:'upTray',  cost:trayCost(),  gain:0.05*base+1});
  if(S.upEye   <MAX_EYE)    o.push({k:'up',key:'upEye',   cost:eyeCost(),   gain:0.05*base+1});
  if(S.upSteady<MAX_STEADY) o.push({k:'up',key:'upSteady',cost:steadyCost(),gain:0.02*base+1});
  TOPPINGS.forEach((t,ti)=>{ if(ti>=itemsUnlocked()) return;
    o.push({k:'top',key:t.id,cost:toppingCost(t),gain:t.ips*permMult()}); });
  return o.filter(x=>x.cost>0 && x.gain>0);
}
function botBuy(strategy){
  if(S.seeds>0) plantSeed();
  for(let guard=0; guard<12; guard++){
    let o=botOptions().filter(x=>x.cost<=S.coins);
    if(strategy==='stubborn') o=o.filter(x=>x.k==='top');
    if(!o.length) return;
    const pick = (strategy==='greedy')
      ? o.reduce((a,b)=>b.cost<a.cost?b:a)
      : o.reduce((a,b)=> (b.cost/b.gain)<(a.cost/a.gain)?b:a);   // лучшая окупаемость
    if(pick.k==='up') buyUp(pick.key); else buyTopping(pick.key);
  }
}
window.__bal = function(strategy){
  strategy=strategy||'optimal';
  S=fresh(); platformLang='ru'; startRound(true);
  const rows=[]; let minutes=0, offlineH=0, lastLoop=0;
  const snap = label => rows.push({label, minutes, offlineH, ips:baseIps(),
    species:S.toppings.length, ups:S.upTray+S.upEye+S.upSteady, seeds:S.seedsUsed});
  const tick = () => {
    catchUp=true; window.__silent=true;
    try{
      earn(baseIps());
      if(hasTwist('w1')){ autoAcc+=1; while(autoAcc>=AUTO_EVERY){ autoAcc-=AUTO_EVERY; autoDrop(); } }
      // примерно одна укладка в секунду, всегда идеальная
      if(mover && roundState==='play'){ window.__forcePerfect(); doDrop(); }
      if(S.stack && S.stack.length>200) S.stack=S.stack.slice(-40);
      botBuy(strategy);
    } finally { catchUp=false; window.__silent=false; }
    minutes += 1/60;
  };
  const session = mins => { for(let i=0;i<mins*60;i++){ tick();
    if(stopReady()){
      catchUp=true; window.__silent=true; try{
        S.seeds+=stopSeeds(stopIdx()); grant(Math.max(100,baseIps()*180));
        if(isFinalStop()){ S.loop++; S.route=0; } else S.route++;
      } finally { catchUp=false; window.__silent=false; }
      snap(S.loop>lastLoop ? ('ФИНАЛ (круг '+S.loop+')') : ('место '+(S.route+1)+' '+stop().id));
      lastLoop=S.loop;
      if(S.loop>=1) return true;
    } } return false; };
  const offline = hours => { offlineH+=hours; fastForward(hours*3600); };
  snap('старт');
  let stopped=false;
  for(let day=0; day<45 && !stopped; day++){
    if(day>0) offline(8);
    if(session(13)){ stopped=true; break; }
    offline(2); if(session(13)){ stopped=true; break; }
    offline(2); if(session(13)){ stopped=true; break; }
  }
  if(!stopped) snap('прогон оборван (не дошёл)');
  return rows;
};

function boot(raw){
  if(booted) return; booted=true;
  restore(raw);
  resize();
  if(!S.stack) startRound(true);
  const hadOffline = checkOffline();          // досчёт офлайна ДО показа интерфейса
  bootAt=Date.now();
  refreshHud();
  $("giftBtn").onclick=claimGift;
  $("x2Btn").onclick=claimX2;
  $("shopBtn").onclick=()=>openModal('shop');
  $("upBtn").onclick=()=>openModal('up');
  $("shelfBtn").onclick=()=>openModal('shelf');
  $("routeChip").onclick=()=>openModal('route');
  $("langBtn").onclick=toggleLang;
  $("mClose").onclick=closeModal;
  $("modal").addEventListener("click", e=>{ if(e.target.id==='modal') closeModal(); });
  document.documentElement.setAttribute("lang", lang());
  persist(true);
  // приоритет окон: окно возвращения → ежедневный бонус → подсказки
  const daily = checkDaily();
  if(hadOffline) openModal('offline');
  else if(daily) openModal('daily');
  if(!S.hintDropShown){
    setTimeout(()=>{ if(!S.hintDropShown && S.drops===0) toast(T("hintDrop")); }, 2500);
  } else S.hintShown=true;
  // дальний горизонт показываем в первый заход, а не на пятой минуте
  if(!S.routeSeen && S.drops<1){ S.routeSeen=1; setTimeout(()=>{ if(!modalOpen) openModal('route'); }, 6000); }
  setTimeout(maybeShortcut, 180000);          // ярлык — когда игрок уже втянулся
  startMusic();
  requestAnimationFrame(frame);
}
(function initSDK(){
  let localRaw=null; try{ localRaw=localStorage.getItem(SAVE_KEY); }catch(e){}
  // Сигнал готовности уходит ДО того, как игра станет доступна для действий,
  // ровно один раз и на ВСЕХ путях запуска (включая ветку без SDK и таймаут).
  let readySent=false;
  function sendReady(){
    if(readySent) return; readySent=true;
    try{ ysdk && ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready(); }catch(e){}
  }
  function go(raw){ sendReady(); boot(raw); }
  function start(){
    if(window.YaGames && !window.__noSDK){
      YaGames.init().then(sdk=>{
        ysdk=sdk;
        readPlatformLang();                      // язык платформы читаем ДО первой отрисовки
        try{ lb = sdk.leaderboards; }catch(e){}
        return sdk.getPlayer({scopes:false})
          .then(p=>{ player=p; return p.getData(["save"]); })
          .then(d=>go(d&&d.save?d.save:localRaw))
          .catch(()=>go(localRaw));
      }).catch(()=>go(localRaw));
      setTimeout(()=>go(localRaw),4000);
    } else go(localRaw);
  }
  if(window.__noSDK || window.YaGames) start();
  else window.__onSdkScriptDone = start;
})();
