<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Блинная Горка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script>
  window.__inIframe = true;
  try{ window.__inIframe = window.top !== window.self; }catch(e){ window.__inIframe = true; }
  if(!window.__inIframe){ window.__noSDK = true; }
  else {
    var __sdkS = document.createElement('script');
    __sdkS.src = 'https://yandex.ru/games/sdk/v2';
    __sdkS.onerror = function(){ window.__noSDK = true; if(window.__onSdkScriptDone) window.__onSdkScriptDone(); };
    __sdkS.onload  = function(){ if(window.__onSdkScriptDone) window.__onSdkScriptDone(); };
    document.head.appendChild(__sdkS);
  }
</script>
<script src="sfx.js"></script>
<style>
  :root{
    /* ── Токены под тему «воскресное утро на кухне, блинная горка» ── */
    --ink:#5C3B23; --ink-soft:#A0806A; --line:#6B4426;
    --paper:#FFF7E8;
    --accent:#E8A33D; --accent-deep:#C97F22;
    --gold:#F2C14E; --mint:#8FBF7A; --lav:#B497D6; --dusk:#7BA6C9;
    --bg:#F6D9A0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:560px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;
        display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(92,59,35,.28)}
  .chip .ic{width:26px;height:26px;flex:none}
  .chip .tx{display:flex;flex-direction:column;gap:1px}
  .chip .v{font-weight:900;font-size:17px;line-height:1}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  #side{position:absolute;right:max(12px,calc(50% - 268px));top:118px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .rbtn{width:52px;height:52px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        box-shadow:0 3px 0 rgba(92,59,35,.28);display:flex;align-items:center;justify-content:center;
        cursor:pointer;transition:transform .08s,box-shadow .08s;padding:0}
  .rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(92,59,35,.28)}
  .rbtn svg{width:27px;height:27px;display:block}
  .rbtn .langTxt{font-weight:900;font-size:13px;color:var(--ink);letter-spacing:.2px}
  .bottom{display:flex;gap:10px;pointer-events:auto}
  .abtn{flex:1;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;
        font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(92,59,35,.28);
        transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(92,59,35,.28)}
  .abtn .bt{font-size:15px;line-height:1.05}
  .abtn .bs{font-size:11px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:3px}
  .abtn .bs svg{width:12px;height:12px}
  .abtn.blue{background:var(--dusk);border-color:#4C7089}
  .abtn.lav{background:var(--lav);border-color:#8767AD}
  .abtn.off{filter:grayscale(.55) brightness(.92)}
  /* ── модалка (начинки/апгрейды/полка) ── */
  #modal{position:absolute;inset:0;background:rgba(40,24,10,.55);display:flex;align-items:flex-end;
         justify-content:center;pointer-events:auto;z-index:5;transition:opacity .2s}
  #modal.hidden{opacity:0;pointer-events:none}
  .sheet{position:relative;background:linear-gradient(180deg,#FFFDF5,#FBEED2);width:100%;max-width:560px;
         border:3px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
         padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:85%;
         display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(40,24,10,.3)}
  #mScroll{overflow-y:auto;overflow-x:hidden}
  #mTitle{font-weight:900;font-size:20px;text-align:center;margin:2px 44px 12px;color:var(--ink)}
  #mClose{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;z-index:2;
          background:var(--paper);border:2.5px solid var(--line);font-size:21px;font-weight:900;
          color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(92,59,35,.28)}
  #mClose:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(92,59,35,.28)}
  .row{display:flex;align-items:center;gap:10px;background:#FFF8E6;border:2.5px solid var(--line);
       border-radius:16px;padding:9px 10px;margin-bottom:9px;box-shadow:0 2px 0 rgba(92,59,35,.18)}
  .row .thumb{width:52px;height:44px;flex:none;background:#F1E3C6;border:2px solid var(--line);border-radius:11px}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px;line-height:1.1}
  .row .ds{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:1px}
  .buy{border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
       font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;
       box-shadow:0 2px 0 rgba(92,59,35,.25);flex:none}
  .buy:active{transform:translateY(1px)}
  .buy.can-not{background:#CFC7B4;border-color:#B3AB98;color:#7C7462}
  .buy.owned{background:var(--mint);border-color:#5FA045}
  .buy.maxed{background:var(--lav);border-color:#8767AD}
  .coll{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .card{background:#FFF8E6;border:2.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;
        text-align:center;box-shadow:0 2px 0 rgba(92,59,35,.18)}
  .card canvas{width:78px;height:56px;display:block;margin:0 auto}
  .card .cn{font-weight:900;font-size:12px;margin-top:3px}
  .card.locked{opacity:.72}
  .card .qm{font-weight:900;font-size:30px;color:var(--ink-soft);height:56px;line-height:56px}
  #toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;z-index:8;text-align:center;max-width:82%}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body oncontextmenu="return false">
<canvas id="cv"></canvas>
<div id="hud">
  <div class="top">
    <div class="chip">
      <svg class="ic" viewBox="0 0 26 26"><path d="M13 5c5 .6 8 4.4 7.4 9.6-.5 4.6-4.6 8-9.8 7.4C5.3 21.4 2 17 3 12 3.8 8 8 4.4 13 5z" fill="#F2C14E" stroke="#5C3B23" stroke-width="2" stroke-linejoin="round"/><path d="M9 12c1.4-1.6 6-1.6 8 0" stroke="#5C3B23" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
      <span class="tx"><span class="v" id="coinsV">0</span><span class="l" id="coinsL">МЁД</span></span>
    </div>
    <div class="chip">
      <svg class="ic" viewBox="0 0 26 26"><rect x="6" y="15" width="14" height="4" rx="2" fill="#E8A33D" stroke="#5C3B23" stroke-width="1.8"/><rect x="7.5" y="10" width="11" height="4" rx="2" fill="#EEB85C" stroke="#5C3B23" stroke-width="1.8"/><rect x="9" y="5" width="8" height="4" rx="2" fill="#F2C97A" stroke="#5C3B23" stroke-width="1.8"/></svg>
      <span class="tx"><span class="v" id="heightV">0</span><span class="l" id="heightL">ВЫСОТА</span></span>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="spacer"></div>
  <div class="bottom">
    <button class="abtn blue" id="giftBtn"><span class="bt" id="giftT">Подарок</span><span class="bs"><svg viewBox="0 0 12 12"><path d="M2 4h8v6H2z" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M6 2v8M2 4l4 0 4 0" stroke="#fff" stroke-width="1.4"/></svg><span id="giftS">+50</span></span></button>
    <button class="abtn lav" id="x2Btn"><span class="bt" id="x2T">Мёд ×2</span><span class="bs"><svg viewBox="0 0 12 12"><path d="M3 2l7 4-7 4z" fill="#fff"/></svg><span id="x2S">5 мин</span></span></button>
  </div>
</div>
<div id="side">
  <button class="rbtn" id="shopBtn" aria-label="Начинки">
    <svg viewBox="0 0 27 27"><rect x="7" y="8" width="13" height="15" rx="3" fill="#E8A33D" stroke="#5C3B23" stroke-width="2.1"/><path d="M9 8c0-2.2 1.8-4 4.5-4S18 5.8 18 8" fill="none" stroke="#5C3B23" stroke-width="2"/></svg>
  </button>
  <button class="rbtn" id="upBtn" aria-label="Улучшения">
    <svg viewBox="0 0 27 27"><path d="M13.5 4l2.3 4.9 5.2.6-3.9 3.6 1.1 5.2-4.7-2.7-4.7 2.7 1.1-5.2L6 9.5l5.2-.6z" fill="#F2C14E" stroke="#5C3B23" stroke-width="2.1" stroke-linejoin="round"/></svg>
  </button>
  <button class="rbtn" id="shelfBtn" aria-label="Полка вкусов">
    <svg viewBox="0 0 27 27"><rect x="4" y="6" width="19" height="6" rx="2" fill="#B497D6" stroke="#5C3B23" stroke-width="2"/><rect x="4" y="15" width="19" height="6" rx="2" fill="#8FBF7A" stroke="#5C3B23" stroke-width="2"/></svg>
  </button>
  <button class="rbtn" id="langBtn" aria-label="Язык"><span class="langTxt" id="langTxt">RU</span></button>
</div>
<div id="modal" class="hidden"><div class="sheet"><button id="mClose">×</button><div id="mTitle"></div><div id="mScroll"><div id="mBody"></div></div></div></div>
<div id="toast"></div>
<script>
'use strict';
// ============================================================
//  Блинная Горка / Pancake Stack — точная механика стекинга (в духе
//  классической игры Stack), впервые в конвейере: тап роняет блин на
//  вершину стопки, выступающий край срезается, идеальная укладка даёт
//  комбо и полную ширину; промах без страховки — стопка падает, высота
//  раунда идёт в награду и рекорд, начинается новый заход без штрафа.
// ============================================================
const SAVE_KEY = "pancake_stack_v1";
const LB_NAME  = "height";
let ysdk=null, player=null, lb=null, saveT=0, booted=false;

// ---------- i18n ----------
function lang(){
  try{ if(S && (S.lang==="ru"||S.lang==="en")) return S.lang; }catch(e){}
  try{ if(ysdk&&ysdk.environment&&ysdk.environment.i18n&&ysdk.environment.i18n.lang)
    return ysdk.environment.i18n.lang==="ru"?"ru":"en"; }catch(e){}
  return (navigator.language||"ru").slice(0,2)==="ru"?"ru":"en";
}
function toggleLang(){
  S.lang = lang()==="ru" ? "en" : "ru";
  document.documentElement.setAttribute("lang", S.lang);
  refreshHud(); persist(true); sfx("tap");
}
const STR = {
  coins:{ru:"МЁД",en:"HONEY"}, height:{ru:"ВЫСОТА",en:"HEIGHT"},
  gift:{ru:"Подарок",en:"Gift"},
  x2:{ru:"Мёд ×2",en:"Honey ×2"}, x2on:{ru:"×2 идёт",en:"×2 active"},
  need:{ru:"Не хватает мёда",en:"Not enough honey"},
  shopTitle:{ru:"Начинки",en:"Toppings"},
  upTitle:{ru:"Улучшения",en:"Upgrades"},
  shelfTitle:{ru:"Полка вкусов",en:"Flavor shelf"},
  buy:{ru:"Купить",en:"Buy"}, owned:{ru:"На полке",en:"On shelf"},
  lvl:{ru:"Ур.",en:"Lv."}, maxLvl:{ru:"Макс.",en:"Max"},
  upSteady:{ru:"Твёрдая лопатка",en:"Steady spatula"}, upSteadyD:{ru:"+1 страховка от промаха за заход",en:"+1 miss rescue per run"},
  upTray:{ru:"Широкий поднос",en:"Wide tray"}, upTrayD:{ru:"+6% к стартовой ширине блина",en:"+6% starting pancake width"},
  upEye:{ru:"Медовый глаз",en:"Honey eye"}, upEyeD:{ru:"Шире окно идеальной укладки",en:"Wider perfect-stack window"},
  daily:{ru:"Ежедневный подарок:",en:"Daily gift:"},
  x2got:{ru:"Мёд удвоен на 5 минут!",en:"Honey doubled for 5 min!"},
  giftGot:{ru:"Подарок:",en:"Gift:"},
  newTopping:{ru:"Новая начинка:",en:"New topping:"},
  allToppings:{ru:"Все начинки на полке!",en:"All toppings on the shelf!"},
  hintDrop:{ru:"Тапни, чтобы уронить блин на стопку",en:"Tap to drop the pancake on the stack"},
  fell:{ru:"Стопка упала! Высота:",en:"Stack fell! Height:"},
  perfect:{ru:"Идеально!",en:"Perfect!"},
  saved:{ru:"Спасено лопаткой!",en:"Saved by the spatula!"},
  ipsUnit:{ru:"начинок",en:"toppings"},
};
const T = k => (STR[k]||{})[lang()] || (STR[k]||{}).ru || k;
const nm = o => lang()==="ru"? o.ru : o.en;

// ---------- Начинки (полка вкусов, фиксированный порядок открытия) ----------
const TOPPINGS = [
  {id:'honey',  ru:'Мёд «Золотинка»',     en:'Honey "Goldie"',       c1:'#F2C14E', c2:'#C97F22', shape:'honey',  mult:0.03, cost:40},
  {id:'jam',    ru:'Варенье «Рубин»',     en:'Raspberry Jam "Ruby"', c1:'#C9375A', c2:'#8C2140', shape:'jam',    mult:0.03, cost:120},
  {id:'cond',   ru:'Сгущёнка «Кремика»',  en:'Condensed Milk "Creamy"', c1:'#FFF3D6', c2:'#E8C98A', shape:'cond', mult:0.03, cost:300},
  {id:'choco',  ru:'Шок. паста «Ирис»',   en:'Choco Spread "Toffee"',c1:'#7A4A2C', c2:'#4E2E18', shape:'choco',  mult:0.03, cost:700},
  {id:'berry',  ru:'Ягоды «Сад»',         en:'Berries "Garden"',     c1:'#5A5FC7', c2:'#8C2140', shape:'berry',  mult:0.03, cost:1500},
  {id:'cream',  ru:'Сметана «Пушинка»',   en:'Sour Cream "Fluff"',   c1:'#FFFBF0', c2:'#E5DCC4', shape:'cream',  mult:0.03, cost:3000},
  {id:'maple',  ru:'Кленовый сироп «Клён»',en:'Maple Syrup "Maple"', c1:'#C97822', c2:'#8A4E14', shape:'maple',  mult:0.03, cost:6000},
  {id:'banana', ru:'Банан «Солнышко»',    en:'Banana "Sunny"',       c1:'#F2E06A', c2:'#C9A93E', shape:'banana', mult:0.03, cost:12000},
  {id:'nuts',   ru:'Орехи «Хрустик»',     en:'Nuts "Crunch"',        c1:'#B98352', c2:'#7A5230', shape:'nuts',   mult:0.03, cost:24000},
];
const TI = id => TOPPINGS.find(s=>s.id===id);

// ---------- Состояние ----------
function freshStack(){ return [{w:0,x:0,c:0}]; } // заполняется в startRound()
function fresh(){ return {
  v:1, coins:0,
  toppings:[],                                 // открытые начинки (полка)
  upSteady:0, upTray:0, upEye:0,                // уровни апгрейдов
  bestHeight:0,                                 // рекорд высоты за один заход (лидерборд)
  stack:null, combo:0, roundSaves:0, speedLvl:0,
  x2Until:0, lastGift:0, lastDaily:"",
  lang:null, hintDropShown:false,
  time:Date.now()
};}
let S = fresh();

// ---------- Экономика ----------
const x2On        = () => Date.now() < S.x2Until;
const toppingMult  = () => 1 + S.toppings.reduce((a,id)=>a+TI(id).mult,0);
const comboMult    = () => Math.min(4, 1+S.combo*0.25);
const MAX_TRAY=6, MAX_EYE=8, MAX_STEADY=5;
const trayCost   = () => S.upTray>=MAX_TRAY?0:Math.floor(50 * Math.pow(1.7, S.upTray));
const eyeCost    = () => S.upEye>=MAX_EYE?0:Math.floor(70 * Math.pow(1.55, S.upEye));
const steadyCost = () => S.upSteady>=MAX_STEADY?0:Math.floor(60 * Math.pow(2.0, S.upSteady));
const perfectRatio = () => Math.max(0.6, 0.92 - 0.035*S.upEye);
const missRatio     = 0.14;
const nextTopping= () => TOPPINGS.find(s=> !S.toppings.includes(s.id));
const toppingCost= sp => sp.cost;
// для базового понимания прогресса (не используется в HUD напрямую)
const upCost = () => { const n=nextTopping(); return n? toppingCost(n) : 0; };

// ---------- Сейвы ----------
function persist(force){
  const now=Date.now();
  if(!force && now-saveT<10000) return;
  saveT=now;
  const raw=JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}); }catch(e){} }
}
function restore(raw){
  if(!raw) return;
  try{ const d=(typeof raw==="string")?JSON.parse(raw):(raw.save?JSON.parse(raw.save):raw);
       if(d&&typeof d==="object") S=Object.assign(fresh(),d); }catch(e){}
  if(!Array.isArray(S.toppings)) S.toppings=[];
}

// ---------- Реклама ----------
let lastAd=0;
function maybeInterstitial(){
  if(!ysdk) return;
  if(Date.now()-lastAd < 180000) return;
  lastAd=Date.now();
  try{ ysdk.adv.showFullscreenAdv({}); }catch(e){}
}
function showRewarded(onReward){
  if(!ysdk){ onReward(); return; }
  try{ ysdk.adv.showRewardedVideo({callbacks:{ onRewarded:onReward, onError:onReward, onClose:()=>{} }}); }
  catch(e){ onReward(); }
}

// ---------- Лидерборд ----------
function submitScore(v){ try{ if(lb&&LB_NAME) lb.setLeaderboardScore(LB_NAME, Math.floor(v)); }catch(e){} }

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const fmt = n => n>=1e6 ? (n/1e6).toFixed(2)+"M" : n>=1e4 ? (n/1e3).toFixed(1)+"K" : Math.floor(n).toString();
function curHeight(){ return S.stack? S.stack.length-1 : 0; }
function refreshHud(){
  $("coinsV").textContent = fmt(S.coins);
  $("heightV").textContent = curHeight();
  $("coinsL").textContent = T("coins");
  $("heightL").textContent = T("height");
  $("giftT").textContent  = T("gift");
  $("giftS").textContent  = "+"+fmt(giftAmt());
  const on=x2On();
  $("x2T").textContent    = on? T("x2on") : T("x2");
  $("x2S").textContent    = on? Math.ceil((S.x2Until-Date.now())/60000)+(lang()==="ru"?" мин":" min") : (lang()==="ru"?"5 мин":"5 min");
  $("x2Btn").classList.toggle("off", on);
  $("langTxt").textContent = lang()==="ru" ? "RU" : "EN";
  document.documentElement.setAttribute("lang", lang());
  if(modalOpen) buildModal(modalOpen);
}
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1600); }

// ---------- Награды ----------
const giftAmt = () => Math.max(50, Math.floor(30 + S.bestHeight*4));

// ---------- Действия: покупки ----------
function buyTopping(id){
  const sp=TI(id); if(!sp || S.toppings.includes(id)) return false;
  const c=toppingCost(sp);
  if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S.toppings.push(id);
  if(S.toppings.length>=TOPPINGS.length) setTimeout(()=>toast(T("allToppings")), 700);
  refreshHud(); persist(true); rebuildBg(); maybeInterstitial(); sfx("buy");
  return true;
}
function buyUp(key){
  const map={upSteady:steadyCost,upTray:trayCost,upEye:eyeCost};
  const max={upSteady:MAX_STEADY,upTray:MAX_TRAY,upEye:MAX_EYE};
  if(S[key]>=max[key]) return false;
  const c=map[key](); if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S[key]++; refreshHud(); persist(true); sfx("buy"); return true;
}
function claimGift(){
  showRewarded(()=>{ const g=giftAmt(); S.coins+=g; refreshHud(); persist(true); sfx("coin");
    toast(T("giftGot")+" +"+fmt(g)); });
}
function claimX2(){
  if(x2On()){ toast(T("x2on")); return; }
  showRewarded(()=>{ S.x2Until=Date.now()+300000; refreshHud(); persist(true); sfx("buy");
    toast(T("x2got")); });
}
function checkDaily(){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastDaily!==today){
    S.lastDaily=today; const g=Math.max(40, Math.floor(20 + S.bestHeight*3));
    S.coins+=g; persist(true);
    setTimeout(()=>toast(T("daily")+" +"+fmt(g)), 700);
  }
}

// ---------- Модалки ----------
let modalOpen=null;
function openModal(kind){ modalOpen=kind; buildModal(kind); $("modal").classList.remove("hidden"); }
function closeModal(){ modalOpen=null; $("modal").classList.add("hidden"); }
function toppingThumb(sp){

function buildModal(kind){
  const body=$("mBody"); const can=(cost)=>S.coins>=cost;
  if(kind==='shop'){
    $("mTitle").textContent=T("shopTitle"); body.innerHTML="";
    TOPPINGS.forEach(sp=>{
      const owned=S.toppings.includes(sp.id);
      const row=document.createElement('div'); row.className="row";
      const th=toppingThumb(sp); th.className="thumb"; row.appendChild(th);
      const info=document.createElement('div'); info.className="info";
      info.innerHTML='<div class="nm">'+nm(sp)+'</div><div class="ds">+'+Math.round(sp.mult*100)+'% '+T("ipsUnit")+'</div>';
      row.appendChild(info);
      const b=document.createElement('button');
      if(owned){ b.className="buy owned"; b.textContent=T("owned"); }
      else{ const c=toppingCost(sp); b.className="buy"+(can(c)?"":" can-not");
        b.textContent=T("buy")+" · "+fmt(c);
        b.onclick=()=>{ if(buyTopping(sp.id)) buildModal('shop'); }; }
      row.appendChild(b); body.appendChild(row);
    });
  } else if(kind==='up'){
    $("mTitle").textContent=T("upTitle"); body.innerHTML="";
    const ups=[
      {k:'upSteady', ic:'<path d="M26 12l6 6-14 14-6-6z" fill="#E8A33D" stroke="#5C3B23" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 30l-4 8 8-4z" fill="#5C3B23"/>', c:steadyCost(), max:MAX_STEADY},
      {k:'upTray',  ic:'<ellipse cx="26" cy="20" rx="18" ry="7" fill="#F2E6C8" stroke="#5C3B23" stroke-width="2.2"/><ellipse cx="26" cy="20" rx="11" ry="4" fill="#EEB85C" stroke="#5C3B23" stroke-width="1.6"/>', c:trayCost(), max:MAX_TRAY},
      {k:'upEye',   ic:'<ellipse cx="26" cy="20" rx="14" ry="9" fill="#FFF3D6" stroke="#5C3B23" stroke-width="2.2"/><circle cx="26" cy="20" r="5" fill="#C97F22" stroke="#5C3B23" stroke-width="1.8"/>', c:eyeCost(), max:MAX_EYE},
    ];
    ups.forEach(u=>{
      const maxed = S[u.k]>=u.max;
      const row=document.createElement('div'); row.className="row";
      const th=document.createElement('div'); th.className="thumb";
      th.innerHTML='<svg viewBox="0 0 52 44" width="52" height="44">'+u.ic+'</svg>'; row.appendChild(th);
      const info=document.createElement('div'); info.className="info";
      info.innerHTML='<div class="nm">'+T(u.k)+' · '+(maxed?T("maxLvl"):T("lvl")+(S[u.k]+1))+'</div>'
        +'<div class="ds">'+T(u.k+'D')+'</div>';
      row.appendChild(info);
      const b=document.createElement('button');
      if(maxed){ b.className="buy maxed"; b.textContent=T("maxLvl"); }
      else{ b.className="buy"+(can(u.c)?"":" can-not"); b.textContent=fmt(u.c);
        b.onclick=()=>{ if(buyUp(u.k)) buildModal('up'); }; }
      row.appendChild(b); body.appendChild(row);
    });
  } else if(kind==='shelf'){
    $("mTitle").textContent=T("shelfTitle")+" ("+S.toppings.length+"/"+TOPPINGS.length+")"; body.innerHTML="";
    const grid=document.createElement('div'); grid.className="coll";
    TOPPINGS.forEach(sp=>{
      const seen=S.toppings.includes(sp.id);
      const card=document.createElement('div'); card.className="card"+(seen?"":" locked");
      if(seen){
        const th=toppingThumb(sp); card.appendChild(th);
        const n=document.createElement('div'); n.className="cn"; n.textContent=nm(sp); card.appendChild(n);
      } else {
        const q=document.createElement('div'); q.className="qm"; q.textContent="?"; card.appendChild(q);
        const n=document.createElement('div'); n.className="cn"; n.textContent="—"; card.appendChild(n);
      }
      grid.appendChild(card);
    });
    body.appendChild(grid);
  }
}

// ---------- Canvas ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1, groundY=0, charScale=1;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let INK="#5C3B23", PAPER="#FFF7E8";
let bgCan=null, fgCan=null;

// ── обязательные цветовые хелперы (RUNBOOK «Модельки: стандарт качества») ──
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function shade(hex, amt){
  const [r,g,b]=hexRgb(hex);
  const f=v=>Math.max(0,Math.min(255,Math.round(amt>=0 ? v+(255-v)*amt : v*(1+amt))));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgba(hex, a){ const [r,g,b]=hexRgb(hex); return 'rgba('+r+','+g+','+b+','+a+')'; }
function sphereFill(g,cx,cy,r,base){
  const grad=g.createRadialGradient(cx-r*0.35,cy-r*0.5,r*0.1,cx,cy,r*1.15);
  grad.addColorStop(0,shade(base,.42)); grad.addColorStop(.55,base); grad.addColorStop(1,shade(base,-.22));
  return grad;
}
function vertFill(g,x0,y0,x1,y1,base){
  const grad=g.createLinearGradient(x0,y0,x1,y1);
  grad.addColorStop(0,shade(base,.32)); grad.addColorStop(1,shade(base,-.2));
  return grad;
}
function glossSpot(g,cx,cy,r){
  const grad=g.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'rgba(255,255,255,.62)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  return grad;
}
function rimShadeRect(g,x,y,w,h){
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip();
  const grad=g.createLinearGradient(x,y+h*0.35,x,y+h);
  grad.addColorStop(0,'rgba(30,16,6,0)'); grad.addColorStop(1,'rgba(30,16,6,.30)');
  g.fillStyle=grad; g.fillRect(x,y,w,h);
  g.restore();
}
function rimShadeEllipse(g,cx,cy,rx,ry){
  g.save(); g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,6.28); g.clip();
  const grad=g.createLinearGradient(cx,cy+ry*0.1,cx,cy+ry);
  grad.addColorStop(0,'rgba(30,16,6,0)'); grad.addColorStop(1,'rgba(30,16,6,.28)');
  g.fillStyle=grad; g.fillRect(cx-rx,cy-ry,rx*2,ry*2);
  g.restore();
}

// ---------- Раскладка сцены ----------
let plateX=0, groundYv=0, windowCX=0, windowCY=0, windowRX=0, windowRY=0;
let catX=0, catY=0, samX=0, samY=0, layerH=26, ampX=0, viewTopY=0;
function rr(a,b){ return a+(b-a)*Math.random(); }
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  charScale=Math.max(0.86, Math.min(1.7, W/460));
  groundY=H*0.72;
  windowCX=W*0.5; windowCY=H*0.19; windowRX=Math.min(W*0.30,210); windowRY=Math.min(H*0.15,170);
  catX=windowCX+windowRX*0.92; catY=windowCY+windowRY*0.62;
  samX=W*0.16; samY=groundY;
  layerH=Math.max(18,Math.min(30,H*0.052));
  ampX=Math.min(W*0.32,160);
  viewTopY=H*0.30;
  plateX=W*0.5;
  INK=cssVar("--ink")||INK; PAPER=cssVar("--paper")||PAPER;
  buildScenery();
  buildBg(); buildFg(); rebuildBg();
  if(!S.stack) startRound(true);
}
addEventListener("resize",resize);

// ---------- Живой мир: пар самовара, кот, занавески, пчела ----------
let steamP=[], curtainPh=0, beePhase=0, catBreath=0;
function buildScenery(){
  steamP=[]; for(let i=0;i<6;i++) steamP.push({x:samX+rr(-4,4),y:samY-rr(0,40),life:rr(0,2),spd:rr(10,16)});
  curtainPh=0; beePhase=rr(0,6.28); catBreath=0;
}
function baseW(){ return Math.min(W*0.30, 140*charScale) * (1+0.06*S.upTray); }

function drawSamovarStatic(g){
  const s=34*charScale, x=samX, y=samY;
  g.strokeStyle=INK; g.lineWidth=2.4;
  g.fillStyle=sphereFill(g,x,y-s*1.3,s*0.62,'#C99A4E');
  g.beginPath(); g.ellipse(x,y-s*1.2,s*0.62,s*0.82,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle=vertFill(g,x-s*0.35,y-s*0.5,x+s*0.35,y,'#B9843C');
  g.beginPath(); g.moveTo(x-s*0.5,y-s*0.5); g.lineTo(x-s*0.4,y); g.lineTo(x+s*0.4,y); g.lineTo(x+s*0.5,y-s*0.5); g.closePath();
  g.fill(); g.stroke();
  g.fillStyle='#8A6230'; g.beginPath(); g.ellipse(x,y,s*0.55,s*0.14,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle='#D9AE63'; g.beginPath(); g.arc(x,y-s*2.0,s*0.16,0,6.28); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x,y-s*1.85); g.lineTo(x,y-s*1.65); g.stroke();
  g.strokeStyle=shade('#8A6230',-.2); g.lineWidth=s*0.14; g.lineCap='round';
  g.beginPath(); g.moveTo(x-s*0.6,y-s*1.1); g.quadraticCurveTo(x-s*0.95,y-s*1.05,x-s*0.9,y-s*0.75); g.stroke();
}
function drawCatWindowsill(g,cx,cy,scale,breath){
  g.save(); g.translate(cx,cy); g.scale(scale,scale);
  const b=1+Math.sin(breath)*0.035;
  g.strokeStyle=INK; g.lineWidth=2.2;
  g.fillStyle=sphereFill(g,-2,-2,16*b,'#D9C7A8');
  g.beginPath(); g.ellipse(0,0,18*b,12*b,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle=sphereFill(g,-14,-16,7,'#D9C7A8');
  g.beginPath(); g.ellipse(-13,-15,7.5,7,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle='#D9C7A8'; g.beginPath(); g.moveTo(-19,-19); g.lineTo(-16,-27); g.lineTo(-13,-20); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-11,-20); g.lineTo(-8,-27); g.lineTo(-6,-19); g.closePath(); g.fill(); g.stroke();
  g.fillStyle='#F0C9C9'; g.beginPath(); g.moveTo(-17,-20); g.lineTo(-15.4,-24); g.lineTo(-13.6,-20); g.closePath(); g.fill();
  g.strokeStyle=shade('#D9C7A8',-.3); g.lineWidth=2; g.lineCap='round';
  g.beginPath(); g.moveTo(15,-2); g.quadraticCurveTo(24,-6,22,-14); g.stroke();
  g.fillStyle='#3A2E22'; g.beginPath(); g.arc(-15.5,-16,0.9,0,6.28); g.fill();
  g.beginPath(); g.arc(-10.5,-16,0.9,0,6.28); g.fill();
  g.restore();
}
function buildBg(){
  bgCan=document.createElement('canvas'); bgCan.width=Math.max(1,W*DPR); bgCan.height=Math.max(1,H*DPR);
  const g=bgCan.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  const wall=g.createLinearGradient(0,0,0,groundY);
  wall.addColorStop(0,'#FBEBC4'); wall.addColorStop(1,'#F3D69A');
  g.fillStyle=wall; g.fillRect(0,0,W,groundY);
  // окно с аркой
  g.save();
  g.beginPath();
  g.moveTo(windowCX-windowRX,windowCY+windowRY);
  g.lineTo(windowCX-windowRX,windowCY);
  g.quadraticCurveTo(windowCX-windowRX,windowCY-windowRY*1.15,windowCX,windowCY-windowRY*1.15);
  g.quadraticCurveTo(windowCX+windowRX,windowCY-windowRY*1.15,windowCX+windowRX,windowCY);
  g.lineTo(windowCX+windowRX,windowCY+windowRY);
  g.closePath();
  g.fillStyle=INK; g.fill();
  g.clip();
  const sky=g.createLinearGradient(0,windowCY-windowRY*1.2,0,windowCY+windowRY);
  sky.addColorStop(0,'#BFE0F2'); sky.addColorStop(0.6,'#E9F3D8'); sky.addColorStop(1,'#CFE7A6');
  g.fillStyle=sky; g.fillRect(windowCX-windowRX-4,windowCY-windowRY*1.3,windowRX*2+8,windowRY*2.4);
  const sx=windowCX+windowRX*0.5, sy=windowCY-windowRY*0.6, sr=windowRX*0.22;
  const sg=g.createRadialGradient(sx,sy,0,sx,sy,sr*2.4);
  sg.addColorStop(0,'rgba(255,248,214,.95)'); sg.addColorStop(0.4,'rgba(255,232,170,.5)'); sg.addColorStop(1,'rgba(255,232,170,0)');
  g.fillStyle=sg; g.beginPath(); g.arc(sx,sy,sr*2.4,0,6.28); g.fill();
  g.fillStyle='#FFF6DC'; g.beginPath(); g.arc(sx,sy,sr,0,6.28); g.fill();
  g.fillStyle='#8FAE6E';
  g.beginPath(); g.moveTo(windowCX-windowRX,windowCY+windowRY);
  for(let x=-windowRX;x<=windowRX;x+=windowRX/6){ g.quadraticCurveTo(windowCX+x+windowRX/12,windowCY+windowRY*0.62,windowCX+x+windowRX/6,windowCY+windowRY*0.78); }
  g.lineTo(windowCX+windowRX,windowCY+windowRY*1.3); g.lineTo(windowCX-windowRX,windowCY+windowRY*1.3); g.closePath(); g.fill();
  g.strokeStyle='#5C7A3E'; g.lineWidth=2;
  [[-0.6,'#6B8A46'],[0.55,'#6B8A46']].forEach(t=>{
    const tx=windowCX+windowRX*t[0], ty=windowCY+windowRY*0.55;
    g.fillStyle=t[1]; g.beginPath(); g.arc(tx,ty-14,12,0,6.28); g.fill();
    g.fillStyle='#7A5A34'; g.fillRect(tx-2,ty-4,4,16);
  });
  g.restore();
  g.strokeStyle=INK; g.lineWidth=5;
  g.beginPath();
  g.moveTo(windowCX-windowRX,windowCY+windowRY);
  g.lineTo(windowCX-windowRX,windowCY);
  g.quadraticCurveTo(windowCX-windowRX,windowCY-windowRY*1.15,windowCX,windowCY-windowRY*1.15);
  g.quadraticCurveTo(windowCX+windowRX,windowCY-windowRY*1.15,windowCX+windowRX,windowCY);
  g.lineTo(windowCX+windowRX,windowCY+windowRY);
  g.stroke();
  g.beginPath(); g.moveTo(windowCX,windowCY-windowRY*1.1); g.lineTo(windowCX,windowCY+windowRY); g.lineWidth=3; g.stroke();
  // подоконник
  g.fillStyle=vertFill(g,0,windowCY+windowRY,0,windowCY+windowRY+14,'#D9AE63');
  g.fillRect(windowCX-windowRX-10,windowCY+windowRY,windowRX*2+20,14);
  g.strokeStyle=INK; g.lineWidth=2; g.strokeRect(windowCX-windowRX-10,windowCY+windowRY,windowRX*2+20,14);
  drawCatWindowsill(g, catX, catY, 1.5*charScale, 0);
  // полка вкусов: открытые начинки стоят на подоконнике слева от кота
  if(S.toppings.length){
    const n=S.toppings.length, totalW=Math.min(windowRX*1.55, 30*n), gap=totalW/n;
    const startX = windowCX - windowRX*0.92 + gap*0.5;
    S.toppings.forEach((id,i)=>{ drawJar(g, startX+i*gap, catY+2, 0.62, TI(id)); });
  }
  // самовар
  drawSamovarStatic(g);
  // мягкая виньетка
  const vg=g.createRadialGradient(W/2,H*0.42,Math.min(W,H)*0.26,W/2,H*0.42,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(50,28,10,.24)');
  g.fillStyle=vg; g.fillRect(0,0,W,groundY);
}
function drawJar(g,cx,cy,s,sp){
  g.save(); g.translate(cx,cy); g.scale(s,s);
  g.strokeStyle=INK; g.lineWidth=1.6;
  g.fillStyle=sphereFill(g,0,2,9,'#E8DDC4');
  g.beginPath(); g.moveTo(-8,10); g.quadraticCurveTo(-9,-6,-6,-9); g.lineTo(6,-9); g.quadraticCurveTo(9,-6,8,10); g.closePath();
  g.fill(); g.stroke();
  g.save(); g.beginPath(); g.moveTo(-8,10); g.quadraticCurveTo(-9,-6,-6,-9); g.lineTo(6,-9); g.quadraticCurveTo(9,-6,8,10); g.closePath(); g.clip();
  g.fillStyle=sphereFill(g,0,3,8,sp.c1);
  g.fillRect(-9,-2,18,13);
  g.fillStyle=rgba('#000',.12); g.fillRect(-9,6,18,5);
  g.restore();
  g.fillStyle='#B98F52'; g.beginPath(); g.rect(-7,-12,14,4); g.fill(); g.stroke();
  g.fillStyle=glossSpot(g,-3,-2,6); g.beginPath(); g.ellipse(-3,-2,4,7,0,0,6.28); g.fill();
  g.restore();
}
// ── уникальные силуэты начинок (для карточек модалок: полка/магазин) ──
function drawTopping(g,sp,cx,cy,scale){
  g.save(); g.translate(cx,cy); g.scale(scale,scale);
  g.strokeStyle=INK; g.lineWidth=1.7;
  if(sp.shape==='honey'){
    g.fillStyle=sphereFill(g,-2,0,13,'#EFE0BE');
    g.beginPath(); g.moveTo(-9,10); g.quadraticCurveTo(-10,-6,-5,-11); g.lineTo(5,-11); g.quadraticCurveTo(10,-6,9,10); g.closePath(); g.fill(); g.stroke();
    g.save(); g.beginPath(); g.moveTo(-9,10); g.quadraticCurveTo(-10,-6,-5,-11); g.lineTo(5,-11); g.quadraticCurveTo(10,-6,9,10); g.closePath(); g.clip();
    g.fillStyle=sphereFill(g,0,4,9,sp.c1); g.fillRect(-10,-2,20,14); g.restore();
    g.fillStyle=sp.c2; g.beginPath(); g.moveTo(0,-13); g.quadraticCurveTo(6,-4,0,4); g.quadraticCurveTo(-6,-4,0,-13); g.closePath(); g.fill(); g.stroke();
    g.fillStyle=glossSpot(g,-3,-2,6); g.beginPath(); g.ellipse(-3,-2,4,7,0,0,6.28); g.fill();
  } else if(sp.shape==='jam'){
    g.fillStyle=sphereFill(g,0,2,12,'#EFE0BE');
    g.beginPath(); g.ellipse(0,2,11,12,0,0,6.28); g.fill(); g.stroke();
    g.save(); g.beginPath(); g.ellipse(0,2,11,12,0,0,6.28); g.clip();
    g.fillStyle=sphereFill(g,0,5,10,sp.c1); g.fillRect(-12,-3,24,18); g.restore();
    g.fillStyle='#E7D9A8'; g.beginPath(); g.moveTo(-9,-9); g.lineTo(9,-9); g.lineTo(6,-14); g.lineTo(-6,-14); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle=sp.c2; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(-6,-13); g.lineTo(-3,-9); g.moveTo(0,-13); g.lineTo(3,-9); g.moveTo(6,-13); g.lineTo(3,-9); g.stroke();
    g.fillStyle=glossSpot(g,-3,0,6); g.beginPath(); g.ellipse(-3,0,4,7,0,0,6.28); g.fill();
  } else if(sp.shape==='cond'){
    g.fillStyle=vertFill(g,-9,-11,9,11,'#EAEAEA');
    g.beginPath(); g.roundRect?g.roundRect(-9,-11,18,22,3):g.rect(-9,-11,18,22); g.fill(); g.stroke();
    g.fillStyle=sp.c1; g.fillRect(-9,-3,18,7);
    g.strokeStyle='rgba(120,100,50,.5)'; g.lineWidth=1; g.strokeRect(-9,-3,18,7);
    g.fillStyle='#C9B978'; g.beginPath(); g.moveTo(6,-11); g.lineTo(12,-15); g.lineTo(12,-11); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle=sp.c1; g.lineWidth=1.8; g.beginPath(); g.moveTo(12,-13); g.quadraticCurveTo(17,-9,15,-2); g.stroke();
    g.fillStyle=glossSpot(g,-3,-4,5); g.beginPath(); g.ellipse(-3,-4,3,8,0,0,6.28); g.fill();
  } else if(sp.shape==='choco'){
    g.fillStyle=sphereFill(g,0,2,12,'#EFE0BE');
    g.beginPath(); g.ellipse(0,2,11,12,0,0,6.28); g.fill(); g.stroke();
    g.save(); g.beginPath(); g.ellipse(0,2,11,12,0,0,6.28); g.clip();
    g.fillStyle=sphereFill(g,0,5,10,sp.c1); g.fillRect(-12,-3,24,18);
    g.strokeStyle=sp.c2; g.lineWidth=1.6;
    for(let k=0;k<3;k++){ g.beginPath(); g.arc(0,2,3+k*3,0,4.6); g.stroke(); }
    g.restore();
    g.fillStyle='#B98F52'; g.fillRect(-7,-13,14,4); g.strokeRect(-7,-13,14,4);
    g.fillStyle=glossSpot(g,-3,0,6); g.beginPath(); g.ellipse(-3,0,4,7,0,0,6.28); g.fill();
  } else if(sp.shape==='berry'){
    [[-6,2,sp.c1],[5,3,sp.c2],[0,-6,sp.c1]].forEach(b=>{
      g.fillStyle=sphereFill(g,b[0]-1.4,b[1]-1.6,6,b[2]);
      g.beginPath(); g.arc(b[0],b[1],6,0,6.28); g.fill(); g.stroke();
    });
    g.fillStyle='#6B8A46'; g.beginPath(); g.ellipse(0,-13,4,2.6,0.5,0,6.28); g.fill(); g.stroke();
  } else if(sp.shape==='cream'){
    g.fillStyle=sphereFill(g,-2,4,11,sp.c1);
    g.beginPath(); g.ellipse(0,7,11,6,0,0,6.28); g.fill(); g.stroke();
    g.fillStyle=sphereFill(g,-2,-2,8,sp.c1);
    g.beginPath(); g.ellipse(0,-1,8,7,0,0,6.28); g.fill(); g.stroke();
    g.fillStyle=sphereFill(g,-1,-9,5,sp.c1);
    g.beginPath(); g.ellipse(0,-9,5,5,0,0,6.28); g.fill(); g.stroke();
    g.fillStyle=glossSpot(g,-3,-9,5); g.beginPath(); g.ellipse(-3,-9,3,4,0,0,6.28); g.fill();
  } else if(sp.shape==='maple'){
    g.fillStyle=sphereFill(g,-2,1,10,'rgba(230,240,245,.55)');
    g.beginPath(); g.moveTo(-6,12); g.lineTo(-7,-4); g.lineTo(-4,-8); g.lineTo(-4,-13); g.lineTo(4,-13); g.lineTo(4,-8); g.lineTo(7,-4); g.lineTo(6,12); g.closePath();
    g.fill(); g.stroke();
    g.save(); g.beginPath(); g.moveTo(-6,12); g.lineTo(-7,-4); g.lineTo(-4,-8); g.lineTo(-4,-13); g.lineTo(4,-13); g.lineTo(4,-8); g.lineTo(7,-4); g.lineTo(6,12); g.closePath(); g.clip();
    g.fillStyle=sphereFill(g,0,6,9,sp.c1); g.fillRect(-8,-2,16,16); g.restore();
    g.fillStyle='#8A5230'; g.fillRect(-2,-16,4,4);
    g.fillStyle=sp.c1; g.beginPath(); g.moveTo(9,-10); g.lineTo(6,-13); g.lineTo(5,-9); g.lineTo(8,-6); g.closePath(); g.fill(); g.stroke();
  } else if(sp.shape==='banana'){
    [[-4,-1,0.15],[5,2,-0.1]].forEach(b=>{
      g.save(); g.translate(b[0],b[1]); g.rotate(b[2]);
      g.fillStyle=sphereFill(g,-1,-1,7,sp.c1);
      g.beginPath(); g.moveTo(-8,3); g.quadraticCurveTo(0,-9,8,3); g.quadraticCurveTo(0,-2,-8,3); g.closePath(); g.fill(); g.stroke();
      g.fillStyle='#fff'; g.beginPath(); g.ellipse(0,0,2.6,1.6,0,0,6.28); g.fill();
      g.restore();
    });
  } else { // nuts
    [[-6,3,0],[4,4,0.4],[0,-4,-0.3],[7,-3,0.2]].forEach(n=>{
      g.save(); g.translate(n[0],n[1]); g.rotate(n[2]);
      g.fillStyle=sphereFill(g,-1,-1,5,sp.c1);
      g.beginPath(); g.moveTo(-5,3); g.quadraticCurveTo(-6,-4,0,-5); g.quadraticCurveTo(6,-4,5,3); g.quadraticCurveTo(0,6,-5,3); g.closePath();
      g.fill(); g.stroke();
      g.strokeStyle=sp.c2; g.lineWidth=0.8; g.beginPath(); g.moveTo(0,-4); g.lineTo(0,4); g.stroke();
      g.strokeStyle=INK;
      g.restore();
    });
  }
  g.restore();
}
function buildFg(){
  fgCan=document.createElement('canvas'); fgCan.width=Math.max(1,W*DPR); fgCan.height=Math.max(1,H*DPR);
  const g=fgCan.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,W,H);
  const wood=g.createLinearGradient(0,groundY,0,H);
  wood.addColorStop(0,'#C9925A'); wood.addColorStop(1,'#9C6A3C');
  g.fillStyle=wood; g.fillRect(0,groundY,W,H-groundY);
  g.strokeStyle='rgba(70,40,16,.22)'; g.lineWidth=2;
  for(let x=0;x<W;x+=34){ g.beginPath(); g.moveTo(x,groundY+4); g.lineTo(x+10,H); g.stroke(); }
  g.strokeStyle=INK; g.lineWidth=4;
  g.beginPath(); g.moveTo(0,groundY); g.lineTo(W,groundY); g.stroke();
  g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(0,groundY+4,W,3);
  // тарелка под стопкой
  const pr=baseW()*0.92;
  g.fillStyle=sphereFill(g,plateX,groundY,pr,'#F7F0DE');
  g.beginPath(); g.ellipse(plateX,groundY,pr,pr*0.30,0,0,6.28); g.fill();
  g.strokeStyle=INK; g.lineWidth=2.4; g.stroke();
  g.strokeStyle='rgba(150,120,70,.35)'; g.lineWidth=1.6;
  g.beginPath(); g.ellipse(plateX,groundY,pr*0.78,pr*0.22,0,0,6.28); g.stroke();
}
function rebuildBg(){ buildBg(); } // начинки рисуются внутри buildBg() по S.toppings — проще перестроить целиком
function drawBackground(){ if(bgCan) ctx.drawImage(bgCan,0,0,W,H); }

// ── живые элементы фона ──
function drawCurtains(t){
  const sway=Math.sin(t*0.7)*6;
  [-1,1].forEach(side=>{
    const x0=windowCX+side*(windowRX+8);
    ctx.fillStyle=vertFill(ctx,x0,0,x0,windowCY+windowRY,'#C9375A');
    ctx.beginPath();
    ctx.moveTo(x0,0);
    ctx.quadraticCurveTo(x0+side*(18+sway),windowCY*0.5,x0+side*8,windowCY+windowRY*0.4);
    ctx.lineTo(x0+side*34,windowCY+windowRY*0.4);
    ctx.quadraticCurveTo(x0+side*(26+sway*0.6),windowCY*0.5,x0+side*34,0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(90,20,30,.3)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(x0+side*16,10); ctx.quadraticCurveTo(x0+side*(16+sway*0.6),windowCY*0.5,x0+side*20,windowCY+windowRY*0.35); ctx.stroke();
  });
}
function drawSteam(dt){
  steamP.forEach(p=>{
    p.y-=p.spd*dt; p.life+=dt;
    if(p.life>2.2){ p.y=samY-64*charScale; p.x=samX+rr(-4,4); p.life=0; }
    const a=Math.max(0,0.5-(p.life/2.2)*0.5);
    ctx.strokeStyle='rgba(255,255,255,'+a.toFixed(2)+')'; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.arc(p.x+Math.sin(p.life*3)*4, p.y, 5+p.life*3, Math.PI*0.2, Math.PI*1.3); ctx.stroke();
  });
}
function drawBee(t){
  beePhase+=0; const a=t*1.6;
  const bx=windowCX+windowRX*0.55+Math.cos(a)*18, by=windowCY-windowRY*0.35+Math.sin(a*1.7)*10;
  ctx.save(); ctx.translate(bx,by);
  ctx.fillStyle='#3A2E22'; ctx.beginPath(); ctx.ellipse(0,0,3.4,2.4,0,0,6.28); ctx.fill();
  ctx.fillStyle='#F2C14E'; ctx.fillRect(-1.6,-2.4,1.4,4.8); ctx.fillRect(0.6,-2.4,1.4,4.8);
  ctx.fillStyle='rgba(255,255,255,.6)';
  const wf=Math.sin(t*40)*2;
  ctx.beginPath(); ctx.ellipse(-1,-2-wf*0.3,2.6,1.4,-0.3,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1,-2-wf*0.3,2.6,1.4,0.3,0,6.28); ctx.fill();
  ctx.restore();
}

// ---------- Раунд: стопка блинов ----------
let mover=null, particles=[], texts=[], fallPiece=null, roundState='play'; // play | fall | resetting
function startRound(silent){
  const w0 = Math.min(baseW(), W*0.34);
  S.stack=[{w:w0, x:plateX, c:0}];
  S.combo=0; S.roundSaves=S.upSteady;
  spawnMover();
  if(!silent) refreshHud();
}
function spawnMover(){
  const top=S.stack[S.stack.length-1];
  const speed = 1.15 + Math.min(2.4, S.stack.length*0.045);
  mover={ w: top.w, phase: rr(0,6.28), speed, c: S.stack.length%4 };
}
function moverX(){ return mover.xOverride!=null ? mover.xOverride : plateX + Math.sin(mover.phase)*ampX; }
function topScrollWorldY(){ return S.stack.length*layerH; }
function scrollY(){ const span=groundY-viewTopY; return Math.max(0, topScrollWorldY()-span); }
function layerScreenY(i){ // i = индекс слоя (0 = первый на тарелке); возвращает {top,bot}
  const sc=scrollY();
  const bot = groundY - (i*layerH - sc);
  const top = groundY - ((i+1)*layerH - sc);
  return {top,bot};
}
const PANC_COLORS=['#EEB85C','#E8A33D','#F2C97A','#DC9A3E'];
function drawPancakeShape(g,x,y,w,h,colBase,wobbleSeed){
  // блин рисуется как «пак»: золотистый верх (эллипс) + подрумяненный
  // боковой торец снизу — даёт видимую толщину при виде почти сбоку,
  // как у настоящей стопки блинов.
  const rx=Math.max(4,w/2), ry=Math.max(3,h*0.30), side=h*0.58;
  g.save(); g.translate(x,y);
  const under=shade(colBase,-.22);
  g.fillStyle=under;
  g.beginPath(); g.rect(-rx,0,rx*2,side); g.fill();
  g.beginPath(); g.ellipse(0,side,rx,ry,0,0,6.283); g.fill();
  g.strokeStyle=INK; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(-rx,0); g.lineTo(-rx,side); g.stroke();
  g.beginPath(); g.moveTo(rx,0); g.lineTo(rx,side); g.stroke();
  g.beginPath(); g.ellipse(0,side,rx,ry,0,0,Math.PI); g.stroke();
  g.fillStyle=rgba('#000',.14);
  g.beginPath(); g.ellipse(0,side,rx*0.94,ry*0.8,0,0,Math.PI); g.fill();
  // верхняя золотистая поверхность
  g.fillStyle=sphereFill(g,-rx*0.28,-ry*0.35,Math.max(rx,ry)*1.1,colBase);
  g.beginPath(); g.ellipse(0,0,rx,ry,0,0,6.283); g.fill(); g.stroke();
  g.save(); g.beginPath(); g.ellipse(0,0,rx,ry,0,0,6.283); g.clip();
  g.fillStyle=glossSpot(g,-rx*0.32,-ry*0.4,rx*0.55);
  g.beginPath(); g.ellipse(-rx*0.28,-ry*0.3,rx*0.42,ry*0.55,-0.3,0,6.28); g.fill();
  g.fillStyle=rgba('#8A5A24',.4);
  for(let k=0;k<4;k++){ const dx=Math.sin(wobbleSeed*3+k*2.1)*rx*0.55, dy=Math.cos(wobbleSeed*2+k*1.7)*ry*0.45;
    g.beginPath(); g.arc(dx,dy,rx*0.05+1,0,6.28); g.fill(); }
  g.restore();
  g.restore();
}
function drawStack(t){
  for(let i=0;i<S.stack.length;i++){
    const L=S.stack[i], pos=layerScreenY(i);
    if(pos.bot < -layerH || pos.top > H+layerH) continue;
    const cy=(pos.top+pos.bot)/2;
    drawPancakeShape(ctx, L.x, cy, L.w, layerH*0.92, PANC_COLORS[L.c%PANC_COLORS.length], i*1.37);
    if(S.toppings.length && (i+1)%3===0){
      const tp=TI(S.toppings[(Math.floor(i/3))%S.toppings.length]);
      ctx.fillStyle=rgba(tp.c1,.75);
      ctx.beginPath(); ctx.ellipse(L.x, cy-layerH*0.12, L.w*0.28, layerH*0.16, 0,0,6.28); ctx.fill();
    }
  }
}
function drawMover(t){
  if(!mover || roundState!=='play') return;
  const top=S.stack[S.stack.length-1], pos=layerScreenY(S.stack.length-1);
  const gap=layerH*2.1;
  const x=moverX(), y=pos.top-gap;
  drawPancakeShape(ctx, x, y, mover.w, layerH*0.92, PANC_COLORS[mover.c%PANC_COLORS.length], S.stack.length*1.37);
  ctx.strokeStyle=rgba('#F2C14E',0.7); ctx.lineWidth=2; ctx.setLineDash([4,5]);
  ctx.beginPath(); ctx.moveTo(x,y+layerH*0.5); ctx.lineTo(x,pos.top); ctx.stroke(); ctx.setLineDash([]);
}
function drawFalling(dt){
  if(!fallPiece) return;
  fallPiece.vy+=380*dt; fallPiece.y+=fallPiece.vy*dt; fallPiece.x+=fallPiece.vx*dt; fallPiece.rot+=fallPiece.vr*dt; fallPiece.life-=dt;
  ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,fallPiece.life));
  ctx.translate(fallPiece.x,fallPiece.y); ctx.rotate(fallPiece.rot);
  drawPancakeShape(ctx,0,0,fallPiece.w,layerH*0.92,PANC_COLORS[fallPiece.c%PANC_COLORS.length],1);
  ctx.restore();
  if(fallPiece.life<=0) fallPiece=null;
}
function crumbFx(x,y,col){
  for(let i=0;i<7;i++){ const a=rr(-0.5,0.5)-Math.PI/2; particles.push({x,y,vx:Math.cos(a)*rr(30,90)*(Math.random()<0.5?-1:1),vy:Math.sin(a)*rr(20,60)-10,life:0.6,g:1,col,r:rr(2,4)}); }
}
function burstFx(x,y,col,label){
  for(let i=0;i<10;i++){ const a=rr(0,6.28); particles.push({x,y,vx:Math.cos(a)*rr(30,80),vy:Math.sin(a)*rr(30,80)-20,life:0.6,g:1,col,r:rr(2,4)}); }
  texts.push({x,y:y-10,life:0.55,label});
}
function updateFx(dt){
  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt*p.g; p.life-=dt; });
  particles=particles.filter(p=>p.life>0);
  texts.forEach(t=>{ t.y-=42*dt; t.life-=dt; });
  texts=texts.filter(t=>t.life>0);
}
function drawFx(){
  particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life/0.6); ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); });
  ctx.globalAlpha=1;
  texts.forEach(t=>{ ctx.globalAlpha=Math.max(0,t.life/0.55); ctx.fillStyle=INK;
    ctx.font='900 15px Nunito, sans-serif'; ctx.textAlign='center'; ctx.fillText(t.label,t.x,t.y); });
  ctx.globalAlpha=1;
}

// ---------- Действие: уронить блин ----------
function doDrop(){
  if(roundState!=='play' || !mover) return;
  const top=S.stack[S.stack.length-1], pos=layerScreenY(S.stack.length-1);
  const mx=moverX(), mw=mover.w;
  const l1=mx-mw/2, r1=mx+mw/2, l2=top.x-top.w/2, r2=top.x+top.w/2;
  const ol=Math.max(l1,l2), or_=Math.min(r1,r2);
  const overlapW=Math.max(0,or_-ol);
  const ratio=overlapW/mw;
  const dropY=(pos.top+pos.bot)/2 - layerH*1.1;
  sfx("tap");
  if(overlapW < 8*charScale || ratio < missRatio){
    if(S.roundSaves>0){
      S.roundSaves--; S.combo=0;
      const newW=top.w, newX=top.x;
      S.stack.push({w:newW,x:newX,c:S.stack.length%4});
      toast(T("saved"));
      burstFx(mx,dropY,'#B497D6','+0');
      spawnMover(); refreshHud(); persist();
      return;
    }
    // промах: стопка падает
    fallPiece={x:mx,y:dropY,vx:(mx<top.x?-60:60),vy:-40,vr:(mx<top.x?-3:3),rot:0,w:mw,c:mover.c,life:1.1};
    roundState='fall'; mover=null; sfx("error");
    const h=curHeight();
    S.bestHeight=Math.max(S.bestHeight,h); submitScore(S.bestHeight);
    toast(T("fell")+" "+h);
    persist(true);
    setTimeout(()=>{ startRound(false); roundState='play'; refreshHud(); }, 1150);
    return;
  }
  // успех
  const isPerfect = ratio >= perfectRatio();
  const newW = isPerfect ? top.w : overlapW;
  const newX = isPerfect ? top.x : (ol+or_)/2;
  if(isPerfect) S.combo++; else S.combo=0;
  const gain=Math.floor((3+Math.floor(S.stack.length*0.5)) * comboMult() * toppingMult() * (x2On()?2:1));
  S.coins+=gain;
  S.stack.push({w:newW,x:newX,c:S.stack.length%4});
  // крошки от срезанного края
  if(!isPerfect){
    if(l1<l2) crumbFx(l1+ (l2-l1)/2, dropY, PANC_COLORS[mover.c%PANC_COLORS.length]);
    if(r1>r2) crumbFx(r1-(r1-r2)/2, dropY, PANC_COLORS[mover.c%PANC_COLORS.length]);
  }
  burstFx(newX,dropY,isPerfect?'#F2C14E':'#E8A33D','+'+fmt(gain)+(isPerfect?' '+T('perfect'):''));
  sfx(isPerfect?"coin":"tap");
  if(!S.hintDropShown){ S.hintDropShown=true; }
  refreshHud(); persist();
  spawnMover();
}

// ---------- Кадр ----------
let lastT=performance.now();
function frame(now){
  let dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now;
  const t=now/1000;
  if(mover && roundState==='play') mover.phase += dt*mover.speed;
  updateFx(dt);

  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawCurtains(t);
  drawSteam(dt);
  drawBee(t);
  drawStack(t);
  drawMover(t);
  if(fallPiece) drawFalling(dt);
  drawFx();
  if(fgCan) ctx.drawImage(fgCan,0,0,W,H);
  requestAnimationFrame(frame);
}

// ---------- Ввод: тап в любое место игрового поля роняет блин ----------
function toLogical(clientX,clientY){ const r=cv.getBoundingClientRect(); return {x:clientX-r.left, y:clientY-r.top}; }
cv.addEventListener("pointerdown", e=>{
  const p=toLogical(e.clientX,e.clientY);
  if(p.y > groundY+40) return; // тап по столу вне игровой зоны — игнор
  doDrop();
});

// ---------- Тест-хуки (Playwright) ----------
window.render_game_to_text = () => JSON.stringify({
  coins:S.coins, lvl:curHeight(), height:curHeight(), bestHeight:S.bestHeight,
  upSteady:S.upSteady, upTray:S.upTray, upEye:S.upEye,
  toppings:S.toppings.length, upCost:upCost(), x2:x2On(), lang:lang(),
  combo:S.combo, roundSaves:S.roundSaves, roundState,
  moverW: mover?mover.w:0, moverX: mover?moverX():0,
  topW: S.stack?S.stack[S.stack.length-1].w:0, topX: S.stack?S.stack[S.stack.length-1].x:0
});
window.advanceTime = ms => { refreshHud(); };
window.__drop = () => doDrop();
window.__forcePerfect = () => { if(mover){ const top=S.stack[S.stack.length-1]; mover.xOverride=top.x; } };
window.__forceMiss = () => { if(mover){ const top=S.stack[S.stack.length-1]; mover.xOverride=top.x+top.w*3+mover.w*2+40; } };
window.__alignMover = x => { if(mover) mover.xOverride=x; };
window.__moverPos = () => ({x: mover?moverX():0, w: mover?mover.w:0});
window.__topPos = () => S.stack? {x:S.stack[S.stack.length-1].x, w:S.stack[S.stack.length-1].w} : null;
window.__grant = n => { S.coins+=n; refreshHud(); persist(); };
window.__buyNextTopping = () => { const n=nextTopping(); return n? buyTopping(n.id) : false; };
window.__buyUp = key => buyUp(key);
window.__toggleLang = () => toggleLang();
window.__stackHeight = () => curHeight();

// ---------- Boot ----------
function boot(raw){
  if(booted) return; booted=true;
  restore(raw);
  resize();
  if(!S.stack) startRound(true);
  refreshHud(); checkDaily();
  $("giftBtn").onclick=claimGift;
  $("x2Btn").onclick=claimX2;
  $("shopBtn").onclick=()=>openModal('shop');
  $("upBtn").onclick=()=>openModal('up');
  $("shelfBtn").onclick=()=>openModal('shelf');
  $("langBtn").onclick=toggleLang;
  $("mClose").onclick=closeModal;
  $("modal").addEventListener("click", e=>{ if(e.target.id==='modal') closeModal(); });
  document.documentElement.setAttribute("lang", lang());
  if(!S.hintDropShown){
    setTimeout(()=>{ if(!S.hintDropShown && S.coins<60 && curHeight()===0) toast(T("hintDrop")); }, 2500);
  }
  startMusic();
  requestAnimationFrame(frame);
}
(function initSDK(){
  let localRaw=null; try{ localRaw=localStorage.getItem(SAVE_KEY); }catch(e){}
  function start(){
    if(window.YaGames && !window.__noSDK){
      YaGames.init().then(sdk=>{
        ysdk=sdk;
        try{ sdk.features.LoadingAPI && sdk.features.LoadingAPI.ready(); }catch(e){}
        const pReady = sdk.getPlayer({scopes:false}).then(p=>{player=p;return p.getData(["save"]);})
          .then(d=>boot(d&&d.save?d.save:localRaw)).catch(()=>boot(localRaw));
        try{ lb = sdk.leaderboards; }catch(e){}
        return pReady;
      }).catch(()=>boot(localRaw));
      setTimeout(()=>boot(localRaw),4000);
    } else boot(localRaw);
  }
  if(window.__noSDK || window.YaGames) start();
  else window.__onSdkScriptDone = start;
})();
</script>
